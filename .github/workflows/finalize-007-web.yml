name: Finalize 007 Web

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - '.github/workflows/finalize-007-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Fetch known-good portal base
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/maysara12/amazon-bot/79ee2cb013c090d299b663d82533233497f9df28/web-007/index.html' \
            --output /tmp/base.html
          grep -q 'SUPABASE_URL' /tmp/base.html
          grep -q '</body>' /tmp/base.html
          if grep -Eq 'إضافة ساكن|نظام السكن|المساهمة الشهرية|hh131Script|hurghadaHousingV130Script' /tmp/base.html; then
            echo 'ERROR: known-good base contains legacy Housing'
            exit 1
          fi

      - name: Decode and validate current Housing v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode android-007/portal/hurghada_housing_v132_patch.html.gz.b64 | gzip --decompress > /tmp/hh132.html
          grep -q 'hh132Script' /tmp/hh132.html
          grep -q 'إثبات الساعات' /tmp/hh132.html
          grep -q 'خرجوا من السكن' /tmp/hh132.html
          if grep -Eq 'hh131Script|hurghadaHousingV130Script' /tmp/hh132.html; then
            echo 'ERROR: Housing v1.3.2 contains legacy Housing code'
            exit 1
          fi

      - name: Build final static portal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('/tmp/base.html').read_text(encoding='utf-8')
          patches = [
              Path('android-007/portal/v110_patch.html').read_text(encoding='utf-8'),
              Path('android-007/portal/modules_v120_patch.html').read_text(encoding='utf-8'),
              Path('/tmp/hh132.html').read_text(encoding='utf-8'),
              Path('android-007/portal/auth_v111_patch.html').read_text(encoding='utf-8'),
          ]
          if '</body>' not in base:
              raise SystemExit('ERROR: base missing </body>')
          final = base.replace('</body>', '\n'.join(patches) + '\n</body>', 1)
          Path('web-007/index.html').write_text(final, encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', final, flags=re.S)
          Path('/tmp/final.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY

          node --check /tmp/final.js
          grep -q 'SUPABASE_URL' web-007/index.html
          grep -q 'data-core="orders-only"' web-007/index.html
          grep -q 'hh132Script' web-007/index.html
          grep -q 'إثبات الساعات' web-007/index.html
          grep -q 'خرجوا من السكن' web-007/index.html
          grep -q 'loginErrorV112Script' web-007/index.html
          if grep -Eq 'إضافة ساكن|نظام السكن|المساهمة الشهرية|hh131Script|hurghadaHousingV130Script|cleanPortalComposerV132' web-007/index.html; then
            echo 'ERROR: legacy or composer code leaked into final portal'
            exit 1
          fi
          echo "Final web bytes: $(wc -c < web-007/index.html)"

      - name: Commit final portal and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '007 Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/finalize-007-web.yml
          git add web-007/index.html
          git commit -m 'Finalize clean 007 Operations web v1.3.2 [skip ci]'
          git push origin HEAD:007-operations-android
