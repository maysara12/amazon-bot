name: Finalize 007 Web

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - '.github/workflows/finalize-007-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-007-web-recovery
  cancel-in-progress: true

jobs:
  restore-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Restore last known-good web portal
        shell: bash
        run: |
          set -euo pipefail
          GOOD_SHA='79ee2cb013c090d299b663d82533233497f9df28'
          git cat-file -e "${GOOD_SHA}^{commit}"
          git show "${GOOD_SHA}:web-007/index.html" > web-007/index.html
          test -s web-007/index.html
          grep -q 'SUPABASE_URL' web-007/index.html
          grep -q '</body>' web-007/index.html
          echo "Restored portal bytes: $(wc -c < web-007/index.html)"

      - name: Commit recovery and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '007 Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web-007/index.html
          git rm .github/workflows/finalize-007-web.yml
          git commit -m 'Restore 007 web to last known-good portal [skip ci]'
          git push origin HEAD:007-operations-android
