name: Build 007 Operations APK

on:
  push:
    branches: [007-operations-android]
    paths:
      - 'android-007/app/**'
      - 'android-007/build.gradle'
      - 'android-007/settings.gradle'
      - 'android-007/gradle.properties'
      - 'android-007/icon/**'
      - '.github/workflows/build-007-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-007-operations-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Publish current verified-build run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          printf 'run_id=%s\ncommit=%s\nstatus=BUILDING\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > build-status/007-operations-v156-current-run.txt
          git config user.name '007 APK Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/007-operations-v156-current-run.txt
          git commit -m 'Track V156 APK build [skip ci]' || true
          git pull --rebase origin 007-operations-android
          git push origin HEAD:007-operations-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify live V156 and build complete fallback
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'APP_VERSION = "1.3.3"' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java
          grep -q 'PUBLIC_PORTAL_ORIGIN + "/portal?app=android&v=" + APP_VERSION' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java
          grep -q 'LOAD_NO_CACHE' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java
          grep -q 'LOCAL_FALLBACK_URL' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java

          curl --fail --silent --show-error --location 'https://007-operations-portal.vercel.app/portal' -o /tmp/live.html
          python - <<'PY'
          from pathlib import Path
          live=Path('/tmp/live.html').read_text(encoding='utf-8')
          required=[
            'fullPortalComposerV156',
            'housing_checkout_workflow_v139_patch.html',
            'housing_v135_fix_patch.html',
            'realtime_v134_patch.html',
            'app_ui_v136_patch.html',
            'housing_requests_filter_v137_patch.html',
            'brand_logo_v138_patch.html',
            'housing_evidence_cleanup_v140_patch.html',
            'housing_checkin_layout_v141_patch.html',
            'housing_assess_archive_v146_patch.html',
            'housing_change_unit_v147_patch.html',
            'housing_stays_filter_v149_patch.html',
            'zones_archive_v153_patch.html',
            'housing_supervisor_assignment_v153_patch.html',
          ]
          missing=[x for x in required if x not in live]
          if missing:
            raise SystemExit('LIVE PORTAL MISSING: '+', '.join(missing))
          print('Live portal V156 verification: OK')
          PY

          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/maysara12/amazon-bot/79ee2cb013c090d299b663d82533233497f9df28/web-007/index.html' \
            -o /tmp/base.html

          mkdir -p android-007/app/src/main/assets/www
          python - <<'PY'
          from pathlib import Path
          import re

          base=Path('/tmp/base.html').read_text(encoding='utf-8')
          patch_paths=[
            'android-007/portal/v110_patch.html',
            'android-007/portal/modules_v120_patch.html',
            'android-007/portal/hurghada_housing_v132_patch.html',
            'android-007/portal/housing_checkout_workflow_v139_patch.html',
            'android-007/portal/housing_v135_fix_patch.html',
            'android-007/portal/auth_v111_patch.html',
            'android-007/portal/realtime_v134_patch.html',
            'android-007/portal/app_ui_v136_patch.html',
            'android-007/portal/housing_requests_filter_v137_patch.html',
            'android-007/portal/brand_logo_v138_patch.html',
            'android-007/portal/housing_evidence_cleanup_v140_patch.html',
            'android-007/portal/housing_checkin_layout_v141_patch.html',
            'android-007/portal/housing_assess_archive_v146_patch.html',
            'android-007/portal/housing_change_unit_v147_patch.html',
            'android-007/portal/housing_stays_filter_v149_patch.html',
            'android-007/portal/zones_archive_v153_patch.html',
            'android-007/portal/housing_supervisor_assignment_v153_patch.html',
          ]
          patches=[Path(p).read_text(encoding='utf-8') for p in patch_paths]
          if '</body>' not in base:
            raise SystemExit('Immutable base is missing </body>')
          html=base.replace('</body>','\n'.join(patches)+'\n</body>',1)
          Path('android-007/app/src/main/assets/www/index.html').write_text(html,encoding='utf-8')

          required={
            'core modules':'modulesV120Script',
            'housing':'hh132Script',
            'checkout proof workflow':'housing_create_checkout_request',
            'housing fixes':'housingV135FixScript',
            'auth/login':'loginErrorV112Script',
            'realtime':'realtimeV134Script',
            'Android UI':'appUiV136Script',
            'request filters/archive':'housingRequestsFilterV137Script',
            '007 brand':'brandLogoV138Script',
            'evidence completion':'housingEvidenceV140Script',
            'check-in dates layout':'housingCheckinLayoutV141Script',
            'accounting archive':'housingAssessArchiveV146Script',
            'change apartment/edit dates':'housingChangeUnitV147Script',
            'apartment search/filter':'housingStaysFilterV149Script',
            'zone removal':'zonesArchiveV153Script',
            'apartment supervisor assignment':'housingSupervisorAssignmentV153Script',
            'change apartment UI':'تغيير شقة المندوب',
            'edit dates UI':'تعديل تواريخ المندوب',
            'apartment assignment UI':'توزيع الشقق على مشرفي السكن',
            'hours evidence UI':'إثبات الساعات',
            'exited housing archive':'خرجوا من السكن',
            'company responses':'ردود الشركة',
            'refunds':'الاسترداد',
            'users':'المستخدمون',
          }
          missing=[name for name,token in required.items() if token not in html]
          if missing:
            raise SystemExit('FALLBACK MISSING FEATURES: '+', '.join(missing))
          if len(html)<150000:
            raise SystemExit(f'Fallback unexpectedly small: {len(html)} bytes')

          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',html,flags=re.S|re.I):
            al=attrs.lower()
            if 'application/json' in al or 'src=' in al:
              continue
            scripts.append(body)
          Path('/tmp/007-fallback.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Complete V156 fallback verification: OK')
          PY
          node --check /tmp/007-fallback.js

      - name: Assemble premium 007 launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-007/app/src/main/res/drawable
          cat android-007/icon/ic_launcher.webp.b64.part1 \
              android-007/icon/ic_launcher.webp.b64.part2 \
              android-007/icon/ic_launcher.webp.b64.part3 \
              android-007/icon/ic_launcher.webp.b64.part4 \
            | base64 --decode > android-007/app/src/main/res/drawable/ic_launcher_007.webp
          test "$(wc -c < android-007/app/src/main/res/drawable/ic_launcher_007.webp)" -eq 44070
          echo '235e044394b6a68ad6df6c4e41b45755d1fa8da6  android-007/app/src/main/res/drawable/ic_launcher_007.webp' | sha1sum -c -

      - name: Verify app version
        run: |
          grep -q "versionCode 13" android-007/app/build.gradle
          grep -q "versionName '1.3.3'" android-007/app/build.gradle

      - name: Build APK
        working-directory: android-007
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: 007-Operations-v1.3.3-Live-V156
          path: android-007/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Mark verified build success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Build steps intentionally generate/overwrite local fallback and launcher files.
          # Discard those temporary working-tree changes before syncing the tracking marker.
          git reset --hard HEAD
          git clean -fd android-007/app/src/main/assets/www android-007/app/src/main/res/drawable
          git fetch origin 007-operations-android
          git reset --hard origin/007-operations-android

          mkdir -p build-status
          printf 'run_id=%s\ncommit=%s\nstatus=SUCCESS\nartifact=007-Operations-v1.3.3-Live-V156\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > build-status/007-operations-v156-current-run.txt
          git config user.name '007 APK Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/007-operations-v156-current-run.txt
          git commit -m 'Mark V156 APK verified [skip ci]'
          git push origin HEAD:007-operations-android
