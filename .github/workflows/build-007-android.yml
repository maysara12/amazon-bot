name: Build 007 Operations APK

# v1.3.0 Hurghada housing workflow
on:
  push:
    branches:
      - 007-operations-android
    paths:
      - 'android-007/**'
      - '.github/workflows/build-007-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble bundled 007 portal UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-007/app/src/main/assets/www
          cat android-007/portal/portal.b64.part1 \
              android-007/portal/portal.b64.part2 \
              android-007/portal/portal.b64.part3 \
              android-007/portal/portal.b64.part4 \
            | base64 --decode \
            | gzip --decompress \
            > android-007/app/src/main/assets/www/index.html

          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('android-007/app/src/main/assets/www/index.html')
          patches = [
              Path('android-007/portal/v110_patch.html').read_text(encoding='utf-8'),
              Path('android-007/portal/auth_v111_patch.html').read_text(encoding='utf-8'),
              Path('android-007/portal/modules_v120_patch.html').read_text(encoding='utf-8'),
              Path('android-007/portal/hurghada_housing_v130_patch.html').read_text(encoding='utf-8'),
          ]
          html = page.read_text(encoding='utf-8')
          if '</body>' not in html:
              raise SystemExit('ERROR: </body> not found in bundled portal')
          html = html.replace('</body>', '\n'.join(patches) + '\n</body>', 1)
          page.write_text(html, encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S)
          Path('/tmp/007-v130.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY

          node --check /tmp/007-v130.js
          test "$(wc -c < android-007/app/src/main/assets/www/index.html)" -gt 100000
          grep -q "SUPABASE_URL" android-007/app/src/main/assets/www/index.html
          grep -q "authV111Script" android-007/app/src/main/assets/www/index.html
          grep -q "loginErrorV112Script" android-007/app/src/main/assets/www/index.html
          grep -q "modulesV120Script" android-007/app/src/main/assets/www/index.html
          grep -q "hurghadaHousingV130Script" android-007/app/src/main/assets/www/index.html
          grep -q "سكن الغردقة" android-007/app/src/main/assets/www/index.html
          grep -q "312" android-007/app/src/main/assets/www/index.html
          grep -q "البريد الإلكتروني أو كلمة المرور غير صحيحة" android-007/app/src/main/assets/www/index.html
          if grep -q "007-operations-portal-e5gbhey78" android-007/app/src/main/assets/www/index.html; then
            echo "ERROR: Internal Vercel deployment dependency found in bundled portal"
            exit 1
          fi
          echo "Bundled v1.3.0 portal size: $(wc -c < android-007/app/src/main/assets/www/index.html) bytes"

      - name: Assemble exact premium 007 launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-007/app/src/main/res/drawable
          cat android-007/icon/ic_launcher.webp.b64.part1 \
              android-007/icon/ic_launcher.webp.b64.part2 \
              android-007/icon/ic_launcher.webp.b64.part3 \
              android-007/icon/ic_launcher.webp.b64.part4 \
            | base64 --decode \
            > android-007/app/src/main/res/drawable/ic_launcher_007.webp
          test "$(wc -c < android-007/app/src/main/res/drawable/ic_launcher_007.webp)" -eq 44070
          echo "235e044394b6a68ad6df6c4e41b45755d1fa8da6  android-007/app/src/main/res/drawable/ic_launcher_007.webp" | sha1sum -c -

      - name: Verify v1.3.0 version
        shell: bash
        run: grep -q "versionName '1.3.0'" android-007/app/build.gradle

      - name: Build Debug APK
        working-directory: android-007
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 007-Operations-v1.3.0
          path: android-007/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Mark successful v1.3.0 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          {
            echo "007 Operations APK v1.3.0"
            echo "status=SUCCESS"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "artifact=007-Operations-v1.3.0"
          } > build-status/007-operations-v1.3.0.txt
          git config user.name "007 APK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add build-status/007-operations-v1.3.0.txt
          git commit -m "Record successful 007 Operations v1.3.0 build [skip ci]" || true
          git push origin HEAD:007-operations-android
