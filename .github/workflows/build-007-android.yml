name: Build 007 Operations APK

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - 'android-007/**'
      - '.github/workflows/build-007-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        working-directory: android-007
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 007-Operations-APK
          path: android-007/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
