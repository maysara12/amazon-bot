name: Build 007 Operations APK

on:
  push:
    branches:
      - 007-operations-android
    paths:
      # Native Android changes only. Portal/UI patches are live-web updates and must not rebuild the APK.
      - 'android-007/app/**'
      - 'android-007/build.gradle'
      - 'android-007/settings.gradle'
      - 'android-007/gradle.properties'
      - 'android-007/icon/**'
      - '.github/workflows/build-007-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-007-operations-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Publish current build run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          {
            echo '007 Operations APK v1.3.3'
            echo 'status=BUILDING'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-status/007-operations-v1.3.3-current-run.txt
          git config user.name '007 APK Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/007-operations-v1.3.3-current-run.txt
          git commit -m 'Track current 007 Operations v1.3.3 build [skip ci]' || true
          git pull --rebase origin 007-operations-android
          git push origin HEAD:007-operations-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify live portal and assemble bundled fallback
        shell: bash
        run: |
          set -euo pipefail

          # Verify the Android shell is still linked to the live portal.
          grep -q 'APP_VERSION = "1.3.3"' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java
          grep -q 'PUBLIC_PORTAL_ORIGIN + "/portal?app=android&v=" + APP_VERSION' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java
          grep -q 'LOAD_NO_CACHE' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java
          grep -q 'LOCAL_FALLBACK_URL' android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java

          # Production /portal is intentionally a small runtime composer now.
          curl --fail --silent --show-error --location \
            'https://007-operations-portal.vercel.app/portal' \
            --output /tmp/live-composer.html
          grep -q '007 Operations' /tmp/live-composer.html
          grep -q 'fullPortalComposerV135' /tmp/live-composer.html
          grep -q 'housing_v135_fix_patch.html' /tmp/live-composer.html
          grep -q 'realtime_v134_patch.html' /tmp/live-composer.html

          # Build a complete offline fallback from immutable base + current portal modules.
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/maysara12/amazon-bot/79ee2cb013c090d299b663d82533233497f9df28/web-007/index.html' \
            --output /tmp/base.html
          grep -q 'SUPABASE_URL' /tmp/base.html
          grep -q '</body>' /tmp/base.html

          mkdir -p android-007/app/src/main/assets/www
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('/tmp/base.html').read_text(encoding='utf-8')
          patch_paths = [
              'android-007/portal/v110_patch.html',
              'android-007/portal/modules_v120_patch.html',
              'android-007/portal/hurghada_housing_v132_patch.html',
              'android-007/portal/housing_v135_fix_patch.html',
              'android-007/portal/auth_v111_patch.html',
              'android-007/portal/realtime_v134_patch.html',
          ]
          patches = [Path(p).read_text(encoding='utf-8') for p in patch_paths]
          if '</body>' not in base:
              raise SystemExit('ERROR: immutable base is missing </body>')
          html = base.replace('</body>', '\n'.join(patches) + '\n</body>', 1)
          Path('android-007/app/src/main/assets/www/index.html').write_text(html, encoding='utf-8')

          scripts = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S | re.I):
              attrs_l = attrs.lower()
              if 'application/json' in attrs_l or 'src=' in attrs_l:
                  continue
              scripts.append(body)
          Path('/tmp/007-v133-fallback.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY

          test "$(wc -c < android-007/app/src/main/assets/www/index.html)" -gt 100000
          grep -q 'SUPABASE_URL' android-007/app/src/main/assets/www/index.html
          grep -q 'modulesV120Script' android-007/app/src/main/assets/www/index.html
          grep -q 'data-core="orders-only"' android-007/app/src/main/assets/www/index.html
          grep -q 'hh132Script' android-007/app/src/main/assets/www/index.html
          grep -q 'housingV135FixScript' android-007/app/src/main/assets/www/index.html
          grep -q 'housing_create_checkout_request' android-007/app/src/main/assets/www/index.html
          grep -q 'loginErrorV112Script' android-007/app/src/main/assets/www/index.html
          grep -q 'realtimeV134Script' android-007/app/src/main/assets/www/index.html
          grep -q 'postgres_changes' android-007/app/src/main/assets/www/index.html
          grep -q 'إثبات الساعات' android-007/app/src/main/assets/www/index.html
          grep -q 'خرجوا من السكن' android-007/app/src/main/assets/www/index.html
          grep -q 'ردود الشركة' android-007/app/src/main/assets/www/index.html
          grep -q 'الاسترداد' android-007/app/src/main/assets/www/index.html
          grep -q 'المستخدمون' android-007/app/src/main/assets/www/index.html

          if grep -Eq 'ISSUE_LABELS|STATUS_LABELS|statusBadge\(|window\.me' android-007/app/src/main/assets/www/index.html; then
            echo 'ERROR: stale compatibility code exists in assembled fallback'
            exit 1
          fi

          node --check /tmp/007-v133-fallback.js

      - name: Assemble exact premium 007 launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-007/app/src/main/res/drawable
          cat android-007/icon/ic_launcher.webp.b64.part1 \
              android-007/icon/ic_launcher.webp.b64.part2 \
              android-007/icon/ic_launcher.webp.b64.part3 \
              android-007/icon/ic_launcher.webp.b64.part4 \
            | base64 --decode \
            > android-007/app/src/main/res/drawable/ic_launcher_007.webp
          test "$(wc -c < android-007/app/src/main/res/drawable/ic_launcher_007.webp)" -eq 44070
          echo '235e044394b6a68ad6df6c4e41b45755d1fa8da6  android-007/app/src/main/res/drawable/ic_launcher_007.webp' | sha1sum -c -

      - name: Verify v1.3.3 version
        shell: bash
        run: |
          grep -q "versionCode 13" android-007/app/build.gradle
          grep -q "versionName '1.3.3'" android-007/app/build.gradle

      - name: Build Debug APK
        working-directory: android-007
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 007-Operations-v1.3.3-Live
          path: android-007/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Mark successful v1.3.3 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          {
            echo '007 Operations APK v1.3.3'
            echo 'status=SUCCESS'
            echo 'mode=LIVE_PORTAL_WITH_ASSEMBLED_FALLBACK'
            echo 'portal=https://007-operations-portal.vercel.app/portal'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'artifact=007-Operations-v1.3.3-Live'
          } > build-status/007-operations-v1.3.3.txt
          git config user.name '007 APK Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/007-operations-v1.3.3.txt
          git commit -m 'Record successful 007 Operations v1.3.3 build [skip ci]' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin 007-operations-android && git push origin HEAD:007-operations-android && exit 0
            sleep 3
          done
          echo 'Build succeeded; status marker push skipped after retries'
