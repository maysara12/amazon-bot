name: Sync 007 Web Modules

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - 'android-007/portal/modules_v120_patch.html'
      - 'android-007/portal/hurghada_housing_v132_patch.html.gz.b64'
      - 'android-007/portal/auth_v111_patch.html'
      - 'android-007/portal/v110_patch.html'
      - 'android-007/portal/portal.b64.part*'
      - '.github/workflows/sync-007-web-modules.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-007-web-modules
  cancel-in-progress: true

jobs:
  sync-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Decode and validate Hurghada v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode android-007/portal/hurghada_housing_v132_patch.html.gz.b64 | gzip --decompress > /tmp/hh132.html
          python - <<'PY'
          from pathlib import Path
          import re
          patches=[
            Path('android-007/portal/modules_v120_patch.html').read_text(encoding='utf-8'),
            Path('/tmp/hh132.html').read_text(encoding='utf-8'),
          ]
          scripts=[]
          for p in patches:
            scripts += re.findall(r'<script[^>]*>(.*?)</script>',p,flags=re.S)
          Path('/tmp/modules-v132.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/modules-v132.js
          grep -q 'data-core="orders-only"' android-007/portal/modules_v120_patch.html
          grep -q 'hh132Script' /tmp/hh132.html
          grep -q 'إثبات الساعات' /tmp/hh132.html
          grep -q 'خرجوا من السكن' /tmp/hh132.html
          if grep -Eq 'إضافة ساكن|نظام السكن|المساهمة الشهرية' android-007/portal/modules_v120_patch.html; then
            echo 'ERROR: legacy housing UI found in core modules'
            exit 1
          fi

      - name: Rebuild clean web source from base
        shell: bash
        run: |
          set -euo pipefail
          cat android-007/portal/portal.b64.part1 \
              android-007/portal/portal.b64.part2 \
              android-007/portal/portal.b64.part3 \
              android-007/portal/portal.b64.part4 \
            | base64 --decode \
            | gzip --decompress \
            > web-007/index.html

          python - <<'PY'
          from pathlib import Path
          base=Path('web-007/index.html')
          html=base.read_text(encoding='utf-8')
          if '</body>' not in html:
              raise SystemExit('ERROR: </body> missing in base portal')
          patches=[
              Path('android-007/portal/v110_patch.html').read_text(encoding='utf-8'),
              Path('android-007/portal/modules_v120_patch.html').read_text(encoding='utf-8'),
              Path('/tmp/hh132.html').read_text(encoding='utf-8'),
              Path('android-007/portal/auth_v111_patch.html').read_text(encoding='utf-8'),
          ]
          html=html.replace('</body>', '\n'.join(patches)+'\n</body>',1)
          base.write_text(html,encoding='utf-8')
          print('clean web source bytes',len(html))
          PY

          grep -q 'data-core="orders-only"' web-007/index.html
          grep -q 'hh132Script' web-007/index.html
          grep -q 'إثبات الساعات' web-007/index.html
          grep -q 'خرجوا من السكن' web-007/index.html
          if grep -q 'hurghadaHousingV130Script' web-007/index.html; then
            echo 'ERROR: v1.3.0 housing survived rebuild'
            exit 1
          fi
          if grep -q 'hh131Script' web-007/index.html; then
            echo 'ERROR: v1.3.1 housing survived rebuild'
            exit 1
          fi
          if grep -Eq 'إضافة ساكن|نظام السكن|المساهمة الشهرية' web-007/index.html; then
            echo 'ERROR: legacy housing fields survived rebuild'
            exit 1
          fi

      - name: Validate final web JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web-007/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S)
          Path('/tmp/007-final-web.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/007-final-web.js

      - name: Mark validated web UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-status
          {
            echo '007 Operations Web v1.3.2 clean'
            echo 'status=SUCCESS'
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-status/007-web-modules-v1.3.2.txt

      - name: Commit clean web source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '007 Web Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add web-007/index.html build-status/007-web-modules-v1.3.2.txt
          git commit -m 'Rebuild clean 007 web source v1.3.2 [skip ci]' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin 007-operations-android && git push origin HEAD:007-operations-android && exit 0
            sleep 3
          done
          echo 'ERROR: could not push clean web source after retries'
          exit 1
