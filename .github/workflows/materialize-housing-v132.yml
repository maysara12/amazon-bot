name: Materialize stable housing portal source

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - '.github/workflows/materialize-housing-v132.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Recover HTML while ignoring broken gzip trailer CRC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, re

          src = Path('android-007/portal/hurghada_housing_v132_patch.html.gz.b64')
          raw = base64.b64decode(''.join(src.read_text(encoding='utf-8').split()))
          if raw[:2] != b'\x1f\x8b':
              raise SystemExit('not gzip')
          flg = raw[3]
          pos = 10
          if flg & 4:
              xlen = int.from_bytes(raw[pos:pos+2], 'little')
              pos += 2 + xlen
          if flg & 8:
              pos = raw.index(b'\x00', pos) + 1
          if flg & 16:
              pos = raw.index(b'\x00', pos) + 1
          if flg & 2:
              pos += 2
          payload = raw[pos:-8]
          html = zlib.decompress(payload, -zlib.MAX_WBITS).decode('utf-8')
          required = ['hh132Script','إثبات الساعات','خرجوا من السكن','housing_generate_assessments_for_stay']
          for marker in required:
              if marker not in html:
                  raise SystemExit(f'missing marker: {marker}')
          Path('android-007/portal/hurghada_housing_v132_patch.html').write_text(html, encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          Path('/tmp/housing-v132.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Recovered bytes:', len(html.encode('utf-8')))
          PY
          node --check /tmp/housing-v132.js

      - name: Commit stable source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '007 Portal Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-housing-v132.yml
          git add android-007/portal/hurghada_housing_v132_patch.html
          git commit -m 'Materialize stable plain Housing v1.3.2 source [skip ci]'
          git pull --rebase origin 007-operations-android
          git push origin HEAD:007-operations-android
