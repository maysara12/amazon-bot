name: Fix 007 Module Session Binding

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - '.github/workflows/fix-007-module-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Repair module user binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ['android-007/portal/modules_v120_patch.html','web-007/index.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              text=text.replace('if(!window.me)return;', 'if(!me)return;')
              text=text.replace('if(!sec||!window.me)return;', 'if(!sec||!me)return;')
              p.write_text(text, encoding='utf-8')
              if 'window.me' in text:
                  raise SystemExit(f'ERROR: stale window.me remains in {name}')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web-007/index.html').read_text(encoding='utf-8')
          Path('/tmp/007-module-fixed.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/007-module-fixed.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '007 Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android-007/portal/modules_v120_patch.html web-007/index.html
          git rm .github/workflows/fix-007-module-session.yml
          git commit -m 'Fix 007 module user binding [skip ci]'
          git push origin HEAD:007-operations-android
