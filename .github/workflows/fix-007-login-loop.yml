name: Fix 007 Login Loop

on:
  push:
    branches:
      - 007-operations-android
    paths:
      - '.github/workflows/fix-007-login-loop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 0

      - name: Repair v1.1 compatibility identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('android-007/portal/v110_patch.html'),
              Path('web-007/index.html'),
          ]
          replacements = {
              'ISSUE_LABELS': 'ISSUE',
              'STATUS_LABELS': 'STATUS',
              'statusBadge(': 'badge(',
          }

          for p in files:
              text = p.read_text(encoding='utf-8')
              before = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == before:
                  print(f'No compatibility replacements needed in {p}')
              else:
                  p.write_text(text, encoding='utf-8')
                  print(f'Repaired {p}')

          source = Path('android-007/portal/v110_patch.html').read_text(encoding='utf-8')
          final = Path('web-007/index.html').read_text(encoding='utf-8')
          for bad in ('ISSUE_LABELS', 'STATUS_LABELS', 'statusBadge('):
              if bad in source or bad in final:
                  raise SystemExit(f'ERROR: stale identifier remains: {bad}')
          for good in ('ISSUE[', 'STATUS[', 'badge('):
              if good not in final:
                  raise SystemExit(f'ERROR: expected compatible identifier missing: {good}')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web-007/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          Path('/tmp/007-login-fixed.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/007-login-fixed.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '007 Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android-007/portal/v110_patch.html web-007/index.html
          git rm .github/workflows/fix-007-login-loop.yml
          git commit -m 'Fix 007 portal login loop [skip ci]'
          git push origin HEAD:007-operations-android
