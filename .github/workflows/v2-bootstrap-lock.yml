name: 007 Operations V2 Bootstrap Lock

on:
  push:
    branches: [007-operations-v2]
    paths:
      - 'operations-v2/package.json'

permissions:
  contents: write

concurrency:
  group: operations-v2-bootstrap-lock
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: operations-v2

    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: 007-operations-v2
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: operations-v2/package-lock.json

      - name: Resolve deterministic dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(v2): lock bootstrap dependencies'
          git push origin HEAD:007-operations-v2
