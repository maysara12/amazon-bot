name: Build 007 Operations Google Play AAB

on:
  workflow_dispatch:
  push:
    branches: [007-operations-android]
    paths:
      - 'android-007/PLAY_RELEASE_TRIGGER.txt'

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    env:
      ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      PLAY_VERSION_CODE: '14'
      PLAY_VERSION_NAME: '1.3.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 007-operations-android
          fetch-depth: 1

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_B64" || { echo 'Missing ANDROID_UPLOAD_KEYSTORE_B64'; exit 1; }
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD" || { echo 'Missing ANDROID_UPLOAD_STORE_PASSWORD'; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_ALIAS" || { echo 'Missing ANDROID_UPLOAD_KEY_ALIAS'; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD" || { echo 'Missing ANDROID_UPLOAD_KEY_PASSWORD'; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build complete current fallback
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/maysara12/amazon-bot/79ee2cb013c090d299b663d82533233497f9df28/web-007/index.html' \
            -o /tmp/base.html

          mkdir -p android-007/app/src/main/assets/www
          python - <<'PY'
          from pathlib import Path
          import re

          base=Path('/tmp/base.html').read_text(encoding='utf-8')
          patch_paths=[
            'android-007/portal/v110_patch.html',
            'android-007/portal/modules_v120_patch.html',
            'android-007/portal/hurghada_housing_v132_patch.html',
            'android-007/portal/housing_checkout_workflow_v139_patch.html',
            'android-007/portal/housing_v135_fix_patch.html',
            'android-007/portal/auth_v111_patch.html',
            'android-007/portal/realtime_v134_patch.html',
            'android-007/portal/app_ui_v136_patch.html',
            'android-007/portal/housing_requests_filter_v137_patch.html',
            'android-007/portal/brand_logo_v138_patch.html',
            'android-007/portal/housing_evidence_cleanup_v140_patch.html',
            'android-007/portal/housing_checkin_layout_v141_patch.html',
            'android-007/portal/housing_assess_archive_v146_patch.html',
            'android-007/portal/housing_change_unit_v147_patch.html',
            'android-007/portal/housing_stays_filter_v149_patch.html',
            'android-007/portal/zones_archive_v153_patch.html',
            'android-007/portal/housing_supervisor_assignment_v153_patch.html',
          ]
          patches=[Path(p).read_text(encoding='utf-8') for p in patch_paths]
          if '</body>' not in base:
            raise SystemExit('Immutable base is missing </body>')
          html=base.replace('</body>','\n'.join(patches)+'\n</body>',1)
          required=[
            'modulesV120Script','hh132Script','housingCheckoutV139Script',
            'housingV135FixScript','loginErrorV112Script','realtimeV134Script',
            'appUiV136Script','housingRequestsFilterV137Script','brandLogoV138Script',
            'housingEvidenceV140Script','housingCheckinLayoutV141Script',
            'housingAssessArchiveV146Script','housingChangeUnitV147Script',
            'housingStaysFilterV149Script','zonesArchiveV153Script',
            'housingSupervisorAssignmentV153Script','توزيع الشقق على مشرفي السكن',
            'إثبات الساعات','خرجوا من السكن','المستخدمون'
          ]
          missing=[x for x in required if x not in html]
          if missing:
            raise SystemExit('Fallback missing: '+', '.join(missing))
          Path('android-007/app/src/main/assets/www/index.html').write_text(html,encoding='utf-8')

          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',html,flags=re.S|re.I):
            al=attrs.lower()
            if 'application/json' in al or 'src=' in al:
              continue
            scripts.append(body)
          Path('/tmp/007-play-fallback.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Current fallback assembled:', len(html), 'bytes')
          PY
          node --check /tmp/007-play-fallback.js

      - name: Assemble launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-007/app/src/main/res/drawable
          cat android-007/icon/ic_launcher.webp.b64.part1 \
              android-007/icon/ic_launcher.webp.b64.part2 \
              android-007/icon/ic_launcher.webp.b64.part3 \
              android-007/icon/ic_launcher.webp.b64.part4 \
            | base64 --decode > android-007/app/src/main/res/drawable/ic_launcher_007.webp

      - name: Prepare Play version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re

          gradle=Path('android-007/app/build.gradle')
          s=gradle.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+', 'versionCode '+os.environ['PLAY_VERSION_CODE'], s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '"+os.environ['PLAY_VERSION_NAME']+"'", s, count=1)
          gradle.write_text(s, encoding='utf-8')

          java=Path('android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java')
          j=java.read_text(encoding='utf-8')
          j=re.sub(r'APP_VERSION\s*=\s*"[^"]+"', 'APP_VERSION = "'+os.environ['PLAY_VERSION_NAME']+'"', j, count=1)
          java.write_text(j, encoding='utf-8')
          PY
          grep -q "versionCode ${PLAY_VERSION_CODE}" android-007/app/build.gradle
          grep -q "versionName '${PLAY_VERSION_NAME}'" android-007/app/build.gradle
          grep -q "APP_VERSION = \"${PLAY_VERSION_NAME}\"" android-007/app/src/main/java/com/zerozeroseven/operations/MainActivity.java

      - name: Restore upload keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/007-upload.jks"

          # GitHub secret paste boxes may preserve a trailing CR/LF. Normalize them
          # without changing the actual keystore bytes or intended passwords.
          CLEAN_B64="$(printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | tr -d '[:space:]')"
          CLEAN_STORE_PASSWORD="$(printf '%s' "$ANDROID_UPLOAD_STORE_PASSWORD" | tr -d '\r\n')"
          CLEAN_KEY_ALIAS="$(printf '%s' "$ANDROID_UPLOAD_KEY_ALIAS" | tr -d '\r\n')"
          CLEAN_KEY_PASSWORD="$(printf '%s' "$ANDROID_UPLOAD_KEY_PASSWORD" | tr -d '\r\n')"

          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$CLEAN_STORE_PASSWORD" \
            -alias "$CLEAN_KEY_ALIAS" >/dev/null

          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          {
            echo 'ANDROID_UPLOAD_STORE_PASSWORD<<__007_STORE__'
            printf '%s\n' "$CLEAN_STORE_PASSWORD"
            echo '__007_STORE__'
            echo 'ANDROID_UPLOAD_KEY_ALIAS<<__007_ALIAS__'
            printf '%s\n' "$CLEAN_KEY_ALIAS"
            echo '__007_ALIAS__'
            echo 'ANDROID_UPLOAD_KEY_PASSWORD<<__007_KEY__'
            printf '%s\n' "$CLEAN_KEY_PASSWORD"
            echo '__007_KEY__'
          } >> "$GITHUB_ENV"

      - name: Build signed release AAB
        working-directory: android-007
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify signed bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB='android-007/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB" >/dev/null
          sha256sum "$AAB"

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: 007-Operations-Play-v1.3.4-AAB
          path: android-007/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
