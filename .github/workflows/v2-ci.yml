name: 007 Operations V2 CI

on:
  push:
    branches: [007-operations-v2]
    paths:
      - 'operations-v2/**'
      - '.github/workflows/v2-ci.yml'
      - '!operations-v2/.bootstrap-green'
      - '!operations-v2/.ci-green'
  pull_request:
    paths:
      - 'operations-v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: write

concurrency:
  group: operations-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://uxeuistzphbbzypzcbsp.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e3g9HCgtIdfxmP1PA0DTwQ_xAR1jcN0

    defaults:
      run:
        working-directory: operations-v2

    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: 007-operations-v2
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: operations-v2/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and production build
        run: npm run build

      - name: Read-only Staging smoke test
        run: node scripts/smoke-staging.mjs

      - name: Record validated V2 source commit
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .ci-green
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-green
          if git diff --cached --quiet; then
            echo 'V2 CI marker already current'
            exit 0
          fi
          git commit -m 'ci(v2): record successful source validation'
          git push origin HEAD:007-operations-v2
