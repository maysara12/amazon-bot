<style id="housingAssessArchiveV146Style">
.hh146-tools{display:flex;gap:8px;flex-wrap:wrap}.hh146-clean{border:1px solid #2f6a51;background:#15392b;color:#a7ecc6;border-radius:9px;padding:8px 11px;font-weight:800}.hh146-archive{border:1px solid #305d89;background:#102238;color:#acd5ff;border-radius:9px;padding:8px 11px;font-weight:800}.hh146-empty{padding:28px;text-align:center;color:#8fa2b9}.hh146-list{display:grid;gap:9px;max-height:62vh;overflow:auto}.hh146-item{border:1px solid #223750;background:#0b1b2d;border-radius:13px;padding:12px}.hh146-item small{color:#91a4b9}.hh146-restore{margin-top:9px;border:1px solid #846d36;background:#342a14;color:#f1cf79;border-radius:8px;padding:7px 10px;font-weight:800}
</style>
<script id="housingAssessArchiveV146Script">
(function(){
'use strict';
let busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin=()=>{try{const u=typeof me!=='undefined'?me:null;return !!u&&(['OWNER','ADMIN','REVIEWER'].includes(u.role)||u.can_see_internal===true)}catch(_){return false}};
const zone=()=>{try{return (typeof zones!=='undefined'?zones:[]).find(x=>x.code==='HURGHADA'||x.name_ar==='الغردقة'||String(x.name_en||'').toLowerCase()==='hurghada')}catch(_){return null}};
function panel(){const root=document.getElementById('hh132Body');if(!root)return null;return [...root.querySelectorAll('.panel')].find(p=>p.querySelector('.panel-head h3')?.textContent.trim()==='الحساب والخصومات')||null}
function ensureModal(){if(document.getElementById('hh146Modal'))return;const w=document.createElement('div');w.innerHTML='<div id="hh146Modal" class="modal"><div class="modal-card"><div class="modal-head"><h3>أرشيف الحساب والخصومات</h3><button class="close" data-hh146-close>×</button></div><div id="hh146ArchiveBody" class="hh146-list"></div></div></div>';document.body.appendChild(w.firstElementChild)}
function keyFromRow(tr){const rider=(tr.cells?.[0]?.querySelector('small')?.textContent||'').trim();const p=(tr.cells?.[1]?.textContent||'').match(/(\d{4}-\d{2}-\d{2}).*?(\d{4}-\d{2}-\d{2})/);return rider&&p?`${rider}|${p[1]}|${p[2]}`:''}
async function archivedMap(){const z=zone();if(!z)return new Map();const [aa,ss]=await Promise.all([window.api(`housing_assessments?select=id,stay_id,period_start,period_end,archived_at&zone_id=eq.${z.id}&archived_at=not.is.null`),window.api(`housing_stays?select=id,rider_id&zone_id=eq.${z.id}`)]);const sm=new Map((ss||[]).map(s=>[s.id,s.rider_id]));return new Map((aa||[]).map(a=>[`${sm.get(a.stay_id)||''}|${a.period_start}|${a.period_end}`,a.id]))}
async function decorate(){if(busy||!isAdmin())return;const p=panel();if(!p)return;busy=true;try{ensureModal();let tools=p.querySelector('.hh146-tools');if(!tools){tools=document.createElement('div');tools.className='hh146-tools';tools.innerHTML='<button class="hh146-clean" data-hh146-clean>✓ تنظيف القائمة</button><button class="hh146-archive" data-hh146-archive>الأرشيف</button>';p.querySelector('.panel-head')?.appendChild(tools)}const map=await archivedMap();const rows=[...(p.querySelector('.hh132-table tbody')?.rows||[])];let shown=0;rows.forEach(tr=>{const hide=map.has(keyFromRow(tr));tr.style.display=hide?'none':'';if(!hide)shown++});let e=p.querySelector('.hh146-empty');if(rows.length&&!shown){if(!e){e=document.createElement('div');e.className='hh146-empty';e.textContent='القائمة فاضية — السجلات محفوظة في الأرشيف';p.appendChild(e)}}else e?.remove()}catch(e){console.warn('assessment archive decorate',e)}finally{busy=false}}
async function clean(){const z=zone();if(!z)return toast('زون الغردقة غير متاح',true);if(!confirm('تنظيف القائمة؟ كل السجلات الحالية هتتخفي من الحساب والخصومات وتفضل محفوظة في الأرشيف.'))return;try{const r=await window.api('rpc/housing_archive_assessments',{method:'POST',body:JSON.stringify({p_zone_id:z.id})});toast(`تم تنظيف القائمة ✅ — ${Number(r||0)} سجل محفوظ في الأرشيف`);if(typeof window.refreshAll==='function')await window.refreshAll();setTimeout(decorate,120)}catch(e){toast(e.message||'تعذر تنظيف القائمة',true)}}
async function showArchive(){ensureModal();const z=zone();if(!z)return;const body=document.getElementById('hh146ArchiveBody');body.innerHTML='<div class="hh146-empty">جاري التحميل…</div>';document.getElementById('hh146Modal').classList.add('open');try{const [aa,ss]=await Promise.all([window.api(`housing_assessments?select=id,stay_id,period_start,period_end,target_hours,actual_hours,deduction_amount,deduction_status,archived_at&zone_id=eq.${z.id}&archived_at=not.is.null&order=archived_at.desc`),window.api(`housing_stays?select=id,rider_id,rider_name&zone_id=eq.${z.id}`)]);const sm=new Map((ss||[]).map(s=>[s.id,s]));body.innerHTML=(aa||[]).length?(aa||[]).map(a=>{const s=sm.get(a.stay_id)||{};return `<div class="hh146-item"><b>${esc(s.rider_name||'—')} — ${esc(s.rider_id||'')}</b><br><small>${a.period_start} → ${a.period_end} | التارجت ${a.target_hours} | المحقق ${a.actual_hours??'—'} | الخصم ${Number(a.deduction_amount||0).toFixed(2)} ج</small><br><button class="hh146-restore" data-hh146-restore="${a.id}">استرجاع للقائمة</button></div>`}).join(''):'<div class="hh146-empty">الأرشيف فاضي</div>'}catch(e){body.innerHTML='<div class="hh146-empty">تعذر تحميل الأرشيف</div>'}}
async function restore(id){try{await window.api('rpc/housing_restore_assessment',{method:'POST',body:JSON.stringify({p_assessment_id:id})});toast('تم استرجاع السجل ✅');await showArchive();if(typeof window.refreshAll==='function')await window.refreshAll();setTimeout(decorate,120)}catch(e){toast(e.message||'تعذر الاسترجاع',true)}}
document.addEventListener('click',e=>{const t=e.target instanceof Element?e.target:null;if(!t)return;if(t.closest('[data-hh146-clean]')){e.preventDefault();clean();return}if(t.closest('[data-hh146-archive]')){e.preventDefault();showArchive();return}const r=t.closest('[data-hh146-restore]');if(r){e.preventDefault();restore(r.dataset.hh146Restore);return}if(t.closest('[data-hh146-close]')){document.getElementById('hh146Modal')?.classList.remove('open');return}if(t.closest('[data-hht="assess"]'))setTimeout(decorate,150)},true);
const prev=window.refreshAll;if(typeof prev==='function')window.refreshAll=async function(){const r=await prev.apply(this,arguments);setTimeout(decorate,120);return r};
setTimeout(decorate,700);
})();
</script>
