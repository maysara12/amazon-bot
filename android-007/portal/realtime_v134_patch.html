<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="realtimeV134Styles">
#realtime007State{position:fixed;z-index:260;left:18px;top:14px;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#102238e8;border:1px solid #29405e;color:#9eb1c7;font:11px Tahoma,Arial,sans-serif;backdrop-filter:blur(10px);pointer-events:none;transition:.2s ease}#realtime007State i{width:8px;height:8px;border-radius:50%;background:#e1a844;box-shadow:0 0 0 3px #e1a84418}#realtime007State.live{color:#9ae8bd;border-color:#286048}#realtime007State.live i{background:#42c58b;box-shadow:0 0 0 3px #42c58b18}#realtime007State.offline{color:#ffc2c9;border-color:#853442}#realtime007State.offline i{background:#ef6a78;box-shadow:0 0 0 3px #ef6a7818}@media(max-width:820px){#realtime007State{top:8px;left:8px;padding:5px 8px;font-size:10px}}
</style>
<div id="realtime007State"><i></i><span>جاري ربط التحديث اللحظي…</span></div>
<script id="realtimeV134Script">
(function(){
  'use strict';
  let rtClient=null,rtChannel=null,activeToken='',refreshTimer=null,pollTimer=null,healthTimer=null;
  let refreshInFlight=false,suppressUntil=0,lastAutoRefresh=0;
  const state=()=>document.getElementById('realtime007State');
  function setState(kind,text){const el=state();if(!el)return;el.className=kind||'';const s=el.querySelector('span');if(s)s.textContent=text}
  function loggedIn(){return !!(window.session?.access_token&&window.me)}
  function safeRefresh(reason,delay=250){
    if(!loggedIn()||Date.now()<suppressUntil)return;
    clearTimeout(refreshTimer);
    refreshTimer=setTimeout(async()=>{
      if(!loggedIn()||refreshInFlight||Date.now()<suppressUntil)return;
      refreshInFlight=true;
      try{
        if(typeof window.refreshAll==='function')await window.refreshAll();
        lastAutoRefresh=Date.now();
        if(navigator.onLine)setState(rtChannel?'live':'','متصل — البيانات محدثة تلقائيًا');
      }catch(e){console.warn('007 realtime refresh',reason,e)}
      finally{refreshInFlight=false;suppressUntil=Date.now()+1200}
    },delay);
  }
  function startFallback(){
    clearInterval(pollTimer);
    pollTimer=setInterval(()=>{if(document.visibilityState==='visible'&&loggedIn())safeRefresh('fallback-poll',0)},5000);
  }
  function stopFallback(){clearInterval(pollTimer);pollTimer=null}
  async function disconnect(){
    try{if(rtClient&&rtChannel)await rtClient.removeChannel(rtChannel)}catch(_){}
    rtChannel=null;rtClient=null;activeToken='';
  }
  async function connect(){
    if(!loggedIn())return false;
    const token=window.session.access_token;
    if(rtChannel&&activeToken===token)return true;
    await disconnect();
    if(!window.supabase?.createClient){setState('offline','Realtime غير متاح — تحديث تلقائي كل 5 ثوانٍ');startFallback();return false}
    try{
      rtClient=window.supabase.createClient(SUPABASE_URL,API_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      rtClient.realtime.setAuth(token);
      activeToken=token;
      rtChannel=rtClient.channel('007-operations-live-v134')
        .on('postgres_changes',{event:'*',schema:'public'},payload=>{
          if(Date.now()<suppressUntil||refreshInFlight)return;
          safeRefresh('postgres:'+String(payload?.table||''),300);
        })
        .subscribe(status=>{
          if(status==='SUBSCRIBED'){
            stopFallback();
            setState('live','متصل لحظيًا');
            safeRefresh('subscribed',50);
          }else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){
            setState('offline','الاتصال اللحظي متوقف — تحديث تلقائي كل 5 ثوانٍ');
            startFallback();
          }
        });
      return true;
    }catch(e){
      console.warn('007 realtime connect',e);
      setState('offline','تعذر Realtime — تحديث تلقائي كل 5 ثوانٍ');
      startFallback();
      return false;
    }
  }
  const originalRefresh=window.refreshAll;
  if(typeof originalRefresh==='function'){
    window.refreshAll=async function(){
      refreshInFlight=true;
      try{return await originalRefresh.apply(this,arguments)}
      finally{refreshInFlight=false;suppressUntil=Date.now()+1200}
    };
  }
  function foreground(){if(!loggedIn())return;safeRefresh('foreground',0);connect()}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')foreground()});
  window.addEventListener('focus',foreground);
  window.addEventListener('online',()=>{setState('','إعادة ربط التحديث اللحظي…');connect();safeRefresh('online',100)});
  window.addEventListener('offline',()=>{setState('offline','لا يوجد إنترنت');startFallback()});
  healthTimer=setInterval(async()=>{
    if(!loggedIn())return;
    const token=window.session.access_token;
    if(!rtChannel)await connect();
    else if(token!==activeToken){try{rtClient.realtime.setAuth(token);activeToken=token}catch(_){await connect()}}
    if(document.visibilityState==='visible'&&Date.now()-lastAutoRefresh>30000)safeRefresh('health',0);
  },2000);
  const bootWait=setInterval(()=>{
    if(loggedIn()){
      clearInterval(bootWait);
      connect();
      safeRefresh('login',100);
    }
  },400);
  setTimeout(()=>{if(!loggedIn())setState('','Realtime جاهز بعد تسجيل الدخول')},2500);
})();
</script>
