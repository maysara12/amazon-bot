<script id="legacyHousingGuardV132">
(function(){
  const OLD_IDS=['housingResidentModal','housingPaymentModal','housingUnitModal','sec-housing','h130RequestModal','h130UnitModal','h130HoursModal','sec-housing130','hh131Modal','sec-hh131'];
  function oldText(el){return /إضافة ساكن|نظام السكن|المساهمة الشهرية|إدارة الشقق والسكان والمصروفات/.test(String(el?.textContent||''))}
  function purge(){
    OLD_IDS.forEach(id=>document.getElementById(id)?.remove());
    document.querySelectorAll('[data-housing-add-resident],[data-add-resident-unit],[data-end-resident],[data-housing-add-payment],[data-add-payment-unit]').forEach(x=>x.remove());
    document.querySelectorAll('.modal,.section').forEach(x=>{if(oldText(x))x.remove()});
    if(!document.getElementById('hh132Script')){
      document.querySelectorAll('[data-go="housing"]').forEach(x=>x.remove());
      document.querySelectorAll('.module-card').forEach(x=>{if(/السكن/.test(x.textContent||''))x.remove()});
    }
  }
  purge();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',purge,{once:true});
  const observer=new MutationObserver(()=>purge());
  const start=()=>{if(document.body)observer.observe(document.body,{childList:true,subtree:true});else setTimeout(start,50)};start();
  const timer=setInterval(()=>{
    purge();
    if(document.getElementById('hh132Script')){
      setTimeout(()=>{purge();observer.disconnect()},2500);
      clearInterval(timer);
    }
  },120);
  setTimeout(()=>{clearInterval(timer);observer.disconnect();purge()},15000);
  window.__purgeLegacyHousing007=purge;
})();
</script>

<script id="authV111Script">

<script id="loginErrorV112Script">
(function(){
  const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim());
  function msg(code,status,message){const c=String(code||'').toLowerCase(),m=String(message||'').toLowerCase();if(c==='email_not_confirmed'||m.includes('email not confirmed'))return 'البريد الإلكتروني لم يتم تأكيده بعد. افتح رسالة التأكيد أولًا.';if(c==='user_banned'||m.includes('banned'))return 'الحساب موقوف حاليًا. تواصل مع إدارة 007.';if(status===429||c.includes('rate')||m.includes('too many')||m.includes('rate limit'))return 'محاولات تسجيل دخول كثيرة. انتظر قليلًا ثم جرّب مرة أخرى.';if(c==='invalid_credentials'||m.includes('invalid login credentials')||m.includes('invalid credentials'))return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';return 'تعذر تسجيل الدخول. راجع البيانات وحاول مرة أخرى.'}
  async function login007(){const btn=document.getElementById('loginBtn'),email=(document.getElementById('loginEmail')?.value||'').trim(),password=document.getElementById('loginPassword')?.value||'';if(!email)return toast('اكتب البريد الإلكتروني',true);if(!validEmail(email))return toast('صيغة البريد الإلكتروني غير صحيحة',true);if(!password)return toast('اكتب كلمة المرور',true);const busy007=(b,o,l)=>typeof busy==='function'?busy(b,o,l):setBusy(b,o,l);busy007(btn,true,'جاري التحقق...');try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:API_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d={};try{d=await r.json()}catch(_){}if(!r.ok)return toast(msg(d.code||d.error_code||d.error,r.status,d.message||d.error_description||d.msg),true);saveSession(d);await boot()}catch(_){toast('تعذر الاتصال بخدمة تسجيل الدخول. تأكد من الإنترنت وحاول مرة أخرى.',true)}finally{busy007(btn,false)}}
  function install(){const b=document.getElementById('loginBtn'),p=document.getElementById('loginPassword');if(b)b.onclick=login007;if(p)p.onkeydown=e=>{if(e.key==='Enter')login007()}}
  window.login007V112=login007;if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(install,0));else setTimeout(install,0);
})();
</script>
