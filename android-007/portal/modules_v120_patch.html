<style id="modulesV120Styles">
.mod-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:8px;background:#091626;border:1px solid #1d3049;border-radius:15px}.mod-tab{border:1px solid #263c58;background:#0d1d30;color:#aebed0;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer}.mod-tab.active{background:#d8b25c;color:#07111f;border-color:#d8b25c}.module-launcher{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}.module-card{background:linear-gradient(145deg,#102238,#091726);border:1px solid #22344d;border-radius:17px;padding:16px;text-align:right;cursor:pointer;color:#fff}.module-card:hover{border-color:#705f36;transform:translateY(-1px)}.module-card i{display:grid;width:40px;height:40px;place-items:center;border-radius:11px;background:#d8b25c17;color:#f0c968;font-style:normal;font-size:19px;margin-bottom:10px}.module-card b{display:block}.module-card small{display:block;color:#8fa2b9;margin-top:5px;line-height:1.6}.module-empty{padding:32px;text-align:center;color:#8498b0;border:1px dashed #29405e;border-radius:15px}.order-company-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr auto;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #1d3048}.order-company-row:last-child{border-bottom:0}.order-company-row small{color:#8799ae}.mini-btn{border:1px solid #2b425f;background:#102238;color:#dce5ef;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer}.mini-btn.gold{border-color:#846d36;color:#f0cb70}
@media(max-width:1100px){.module-launcher{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.module-launcher{grid-template-columns:1fr 1fr}.order-company-row{grid-template-columns:1fr 1fr}.order-company-row>*:nth-child(4){grid-column:1/-1}.mod-tabs{overflow:auto;flex-wrap:nowrap}.mod-tab{white-space:nowrap}.module-card{padding:13px}}
</style>
<script id="modulesV120Script" data-core="orders-only">
(function(){
  let appModules=[];
  let currentOrderTab='overview';
  const baseRefreshAll=window.refreshAll;
  const htmlEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const moduleEnabled=slug=>{const m=appModules.find(x=>x.slug===slug);return !m||m.active!==false};
  const visibleSection=id=>document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));
  const setHeader=(title,sub)=>{const a=document.getElementById('pageTitle'),b=document.getElementById('pageSub');if(a)a.textContent=title;if(b)b.textContent=sub};
  const setNavActive=key=>document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===key));

  function orderTabs(active){return `<div class="mod-tabs" data-order-tabs>${[
    ['overview','نظرة عامة'],['cases','الحالات'],['review','المراجعة'],['new','رفع أوردر'],['company','ردود الشركة'],['refunds','الاسترداد']
  ].map(x=>`<button class="mod-tab ${active===x[0]?'active':''}" type="button" data-order-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}
  function bindTabs(){document.querySelectorAll('[data-order-tab]').forEach(b=>b.onclick=()=>showOrderTab(b.dataset.orderTab))}
  function ensureSections(){
    const main=document.querySelector('.main');if(!main)return;
    if(!document.getElementById('sec-orders-overview'))main.insertAdjacentHTML('beforeend','<section id="sec-orders-overview" class="section"><div id="ordersOverviewBody"></div></section>');
    if(!document.getElementById('sec-orders-company'))main.insertAdjacentHTML('beforeend','<section id="sec-orders-company" class="section"><div id="ordersCompanyBody"></div></section>');
    if(!document.getElementById('sec-orders-refunds'))main.insertAdjacentHTML('beforeend','<section id="sec-orders-refunds" class="section"><div id="ordersRefundBody"></div></section>');
    ['sec-cases','sec-review','sec-new'].forEach(id=>{const s=document.getElementById(id);if(s&&!s.querySelector('[data-order-tabs]'))s.insertAdjacentHTML('afterbegin',orderTabs(id.replace('sec-','')))});
    ['housingResidentModal','housingPaymentModal','housingUnitModal','sec-housing','h130RequestModal','h130UnitModal','h130HoursModal','sec-housing130','hh131Modal','sec-hh131'].forEach(id=>document.getElementById(id)?.remove());
  }
  function buildModuleNav(){
    if(!me)return;
    const defs=[
      ['dashboard','⌂','الرئيسية',true],
      ['orders','▤','الأوردرات',moduleEnabled('orders')],
      ['zones','⌖','التشغيل',moduleEnabled('operations')&&me.role!=='SUPERVISOR'],
      ['users','♟','المستخدمون',moduleEnabled('admin')&&admin()]
    ].filter(x=>x[3]);
    const nav=document.getElementById('desktopNav');if(nav){nav.innerHTML=defs.map(x=>`<button data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
    const mob=document.getElementById('mobileNav');if(mob){const m=defs.filter(x=>['dashboard','orders'].includes(x[0]));mob.innerHTML=m.map(x=>`<button data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');mob.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
  }
  window.buildNav=function(){ensureSections();buildModuleNav();go('dashboard')};
  window.go=function(x){
    ensureSections();
    if(x==='dashboard'){visibleSection('sec-dashboard');setHeader('لوحة التحكم','نظرة عامة على منظومة 007');setNavActive('dashboard');renderModuleLauncher()}
    else if(x==='orders'||['overview','cases','review','new','company','refunds'].includes(x)){showOrderTab(x==='orders'?currentOrderTab:x)}
    else if(x==='zones'){visibleSection('sec-zones');setHeader('التشغيل','إدارة الزونات ومناطق التشغيل');setNavActive('zones');renderZones()}
    else if(x==='users'){visibleSection('sec-users');setHeader('المستخدمون','الحسابات والصلاحيات وربط الزونات');setNavActive('users');loadUsers()}
    window.scrollTo({top:0,behavior:'smooth'});
  };
  async function loadModuleData(){try{appModules=await api('app_modules?select=*&order=sort_order.asc')||[]}catch(_){appModules=[]}}
  window.refreshAll=async function(){await baseRefreshAll();await loadModuleData();ensureSections();buildModuleNav();renderModuleLauncher();renderOrdersOverview()};
  function renderModuleLauncher(){
    const sec=document.getElementById('sec-dashboard');if(!sec||!me)return;
    let wrap=document.getElementById('moduleLauncherV120');if(!wrap){wrap=document.createElement('div');wrap.id='moduleLauncherV120';sec.insertBefore(wrap,sec.firstChild)}
    const defs=[['orders','▤','الأوردرات','رفع ومراجعة ومتابعة ردود الشركة'],['zones','⌖','التشغيل','الزونات ومناطق التشغيل'],['users','♟','الإدارة','المستخدمون والصلاحيات']]
      .filter(x=>(x[0]!=='zones'||me.role!=='SUPERVISOR')&&(x[0]!=='users'||admin())&&(x[0]!=='orders'||moduleEnabled('orders')));
    wrap.innerHTML=`<div class="module-launcher">${defs.map(x=>`<button class="module-card" type="button" onclick="go('${x[0]}')"><i>${x[1]}</i><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>`;
  }
  function showOrderTab(tab){
    currentOrderTab=tab;const map={overview:'sec-orders-overview',cases:'sec-cases',review:'sec-review',new:'sec-new',company:'sec-orders-company',refunds:'sec-orders-refunds'};
    visibleSection(map[tab]||map.overview);setHeader('الأوردرات','كل دورة الأوردر في مكان واحد');setNavActive('orders');
    document.querySelectorAll('[data-order-tabs]').forEach(x=>x.outerHTML=orderTabs(tab));
    if(tab==='overview')renderOrdersOverview();if(tab==='cases')renderCases();if(tab==='review')renderReview();if(tab==='company')renderOrdersCompany();if(tab==='refunds')renderOrdersRefunds();bindTabs();
  }
  function renderOrdersOverview(){
    const el=document.getElementById('ordersOverviewBody');if(!el)return;const total=cases.length,reviewN=cases.filter(c=>c.status==='UNDER_REVIEW').length,submitted=cases.filter(c=>c.status==='SUBMITTED').length,accepted=cases.filter(c=>['COMPANY_APPROVED','REFUND_PENDING','REFUNDED'].includes(c.status)).length,rejected=cases.filter(c=>c.status==='COMPANY_REJECTED').length,refund=cases.filter(c=>c.status==='REFUND_PENDING').length;
    el.innerHTML=orderTabs('overview')+`<div class="cards"><div class="card kpi"><small>إجمالي الأوردرات</small><b>${total}</b></div><div class="card kpi"><small>تحت المراجعة</small><b>${reviewN}</b></div><div class="card kpi"><small>بانتظار الشركة</small><b>${submitted}</b></div><div class="card kpi"><small>مقبول</small><b>${accepted}</b></div></div><div class="panel"><div class="panel-head"><h3>مسار الأوردرات</h3></div><div class="company-summary"><div class="company-stat"><small>مرفوض من الشركة</small><b>${rejected}</b></div><div class="company-stat"><small>بانتظار الاسترداد</small><b>${refund}</b></div></div></div><div class="panel"><div class="panel-head"><h3>أحدث الأوردرات</h3></div>${caseMarkup(cases.slice(0,8))}</div>`;bindTabs();
  }
  function renderOrdersCompany(){
    const el=document.getElementById('ordersCompanyBody');if(!el)return;const rows=cases.filter(c=>c.status==='SUBMITTED'||c.company_result||c.company_comment);
    el.innerHTML=orderTabs('company')+`<div class="panel"><div class="panel-head"><h3>ردود الشركة</h3><span class="badge">${rows.length} حالة</span></div>${rows.length?rows.map(c=>`<div class="order-company-row"><div><small>الأوردر</small><b>${htmlEsc(c.order_id)}</b></div><div><small>الزون</small><b>${htmlEsc(c.zones?.name_ar||'—')}</b></div><div><small>النتيجة</small><b>${htmlEsc(c.company_result||'بانتظار الرد')}</b></div><div><small>تعليق الشركة</small><b>${htmlEsc(c.company_comment||'—')}</b></div><button class="mini-btn gold" onclick="openCase('${c.id}')">تفاصيل</button></div>`).join(''):'<div class="module-empty">لا توجد ردود شركة حتى الآن</div>'}</div>`;bindTabs();
  }
  function renderOrdersRefunds(){
    const el=document.getElementById('ordersRefundBody');if(!el)return;const rows=cases.filter(c=>c.refund_status!=='NOT_APPLICABLE'||['REFUND_PENDING','REFUNDED'].includes(c.status));
    el.innerHTML=orderTabs('refunds')+`<div class="panel"><div class="panel-head"><h3>الاسترداد</h3><span class="badge">${rows.length} حالة</span></div>${rows.length?caseMarkup(rows):'<div class="module-empty">لا توجد حالات استرداد حتى الآن</div>'}</div>`;bindTabs();
  }
  window.showOrderTabV120=showOrderTab;
  ensureSections();
})();
</script>
