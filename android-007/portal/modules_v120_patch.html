<style id="modulesV120Styles">
.mod-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:8px;background:#091626;border:1px solid #1d3049;border-radius:15px}.mod-tab{border:1px solid #263c58;background:#0d1d30;color:#aebed0;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer}.mod-tab.active{background:#d8b25c;color:#07111f;border-color:#d8b25c}.module-launcher{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}.module-card{background:linear-gradient(145deg,#102238,#091726);border:1px solid #22344d;border-radius:17px;padding:16px;text-align:right;cursor:pointer;color:#fff}.module-card:hover{border-color:#705f36;transform:translateY(-1px)}.module-card i{display:grid;width:40px;height:40px;place-items:center;border-radius:11px;background:#d8b25c17;color:#f0c968;font-style:normal;font-size:19px;margin-bottom:10px}.module-card b{display:block}.module-card small{display:block;color:#8fa2b9;margin-top:5px;line-height:1.6}.housing-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}.housing-kpi{background:#0d1d30;border:1px solid #213651;border-radius:15px;padding:14px}.housing-kpi small{display:block;color:#879bb3}.housing-kpi b{display:block;font-size:23px;margin-top:7px}.house-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.house-card{background:#0b1b2d;border:1px solid #223750;border-radius:17px;padding:16px}.house-card .house-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.house-card small{color:#8699b0}.house-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.house-meta>div{background:#081624;border-radius:10px;padding:9px}.house-meta b{display:block;margin-top:3px}.house-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.mini-btn{border:1px solid #2b425f;background:#102238;color:#dce5ef;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer}.mini-btn.gold{border-color:#846d36;color:#f0cb70}.mini-btn.bad{border-color:#6f3039;color:#ffb3bb}.module-empty{padding:32px;text-align:center;color:#8498b0;border:1px dashed #29405e;border-radius:15px}.housing-note{padding:12px 14px;background:#102138;border:1px solid #243b59;border-radius:12px;color:#aabbd0;line-height:1.8;margin-bottom:14px}.finance-hidden{padding:15px;border-radius:13px;background:#171f2b;border:1px solid #303d50;color:#9eacbd}.section .mod-tabs:first-child{margin-top:0}.order-company-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr auto;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #1d3048}.order-company-row:last-child{border-bottom:0}.order-company-row small{color:#8799ae}.module-group-title{font-size:11px;color:#71849b;padding:16px 14px 7px;font-weight:800;letter-spacing:.4px}.nav button .nav-arrow{margin-right:auto;color:#526880}.housing-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:1100px){.housing-kpis{grid-template-columns:repeat(3,1fr)}.house-grid{grid-template-columns:1fr 1fr}.module-launcher{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.housing-kpis{grid-template-columns:1fr 1fr}.house-grid,.housing-form-grid{grid-template-columns:1fr}.module-launcher{grid-template-columns:1fr 1fr}.order-company-row{grid-template-columns:1fr 1fr}.order-company-row>*:nth-child(4){grid-column:1/-1}.mod-tabs{overflow:auto;flex-wrap:nowrap}.mod-tab{white-space:nowrap}.module-card{padding:13px}}
</style>
<script id="modulesV120Script">
(function(){
  let appModules=[];
  let housingUnits=[];
  let housingResidents=[];
  let housingPayments=[];
  let currentOrderTab='overview';
  let currentHousingTab='overview';
  const housingRoles=['OWNER','ADMIN','REVIEWER','ZONE_MANAGER'];
  const financeRoles=['OWNER','ADMIN','REVIEWER'];
  const baseRefreshAll=refreshAll;

  function htmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function housingAllowed(){return !!me&&housingRoles.includes(me.role)}
  function financeAllowed(){return !!me&&(financeRoles.includes(me.role)||me.can_see_internal)}
  function moduleEnabled(slug){const m=appModules.find(x=>x.slug===slug);return !m||m.active!==false}
  function zoneName(id){return zones.find(z=>z.id===id)?.name_ar||'—'}
  function unitName(id){return housingUnits.find(u=>u.id===id)?.name||'—'}
  function today(){return new Date().toISOString().slice(0,10)}
  function money(v){return Number(v||0).toFixed(2)+' ج'}
  function visibleSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id))}
  function setHeader(title,sub){const a=document.getElementById('pageTitle'),b=document.getElementById('pageSub');if(a)a.textContent=title;if(b)b.textContent=sub}
  function setNavActive(key){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===key))}

  function orderTabs(active){return `<div class="mod-tabs" data-order-tabs>${[
    ['overview','نظرة عامة'],['cases','الحالات'],['review','المراجعة'],['new','رفع أوردر'],['company','ردود الشركة'],['refunds','الاسترداد']
  ].map(x=>`<button class="mod-tab ${active===x[0]?'active':''}" type="button" data-order-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}
  function housingTabs(active){return `<div class="mod-tabs" data-housing-tabs>${[
    ['overview','نظرة عامة'],['units','الشقق'],['residents','السكان'],['payments','المدفوعات']
  ].filter(x=>x[0]!=='payments'||financeAllowed()).map(x=>`<button class="mod-tab ${active===x[0]?'active':''}" type="button" data-housing-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}
  function bindDynamicTabs(){document.querySelectorAll('[data-order-tab]').forEach(b=>b.onclick=()=>showOrderTab(b.dataset.orderTab));document.querySelectorAll('[data-housing-tab]').forEach(b=>b.onclick=()=>showHousingTab(b.dataset.housingTab))}

  function ensureSections(){
    const main=document.querySelector('.main'); if(!main)return;
    if(!document.getElementById('sec-orders-overview')) main.insertAdjacentHTML('beforeend',`<section id="sec-orders-overview" class="section"><div id="ordersOverviewBody"></div></section>`);
    if(!document.getElementById('sec-orders-company')) main.insertAdjacentHTML('beforeend',`<section id="sec-orders-company" class="section"><div id="ordersCompanyBody"></div></section>`);
    if(!document.getElementById('sec-orders-refunds')) main.insertAdjacentHTML('beforeend',`<section id="sec-orders-refunds" class="section"><div id="ordersRefundBody"></div></section>`);
    if(!document.getElementById('sec-housing')) main.insertAdjacentHTML('beforeend',`<section id="sec-housing" class="section"><div id="housingBody"></div></section>`);
    ['sec-cases','sec-review','sec-new'].forEach(id=>{const s=document.getElementById(id);if(s&&!s.querySelector('[data-order-tabs]'))s.insertAdjacentHTML('afterbegin',orderTabs(id.replace('sec-','')))});
    ensureHousingModals();
  }

  function ensureHousingModals(){if(document.getElementById('housingUnitModal'))return;document.body.insertAdjacentHTML('beforeend',`
  <div id="housingUnitModal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="housingUnitTitle">إضافة شقة / وحدة</h3><button class="close" data-hclose="housingUnitModal">×</button></div><input id="huId" type="hidden"><div class="housing-form-grid">
    <div class="field"><label>الزون</label><select id="huZone" class="input"></select></div><div class="field"><label>اسم الوحدة</label><input id="huName" class="input" placeholder="مثال: شقة الغردقة 1"></div>
    <div class="field"><label>الكود</label><input id="huCode" class="input" placeholder="HRG-APT-01"></div><div class="field"><label>النوع</label><select id="huType" class="input"><option value="APARTMENT">شقة</option><option value="ROOM">غرفة</option><option value="HOUSE">منزل</option><option value="OTHER">أخرى</option></select></div>
    <div class="field"><label>الإيجار الشهري</label><input id="huRent" class="input" type="number" min="0" step="0.01"></div><div class="field"><label>السعة</label><input id="huCapacity" class="input" type="number" min="1" value="1"></div>
    <div class="field"><label>اسم المالك</label><input id="huLandlord" class="input"></div><div class="field"><label>تليفون المالك</label><input id="huPhone" class="input"></div>
    <div class="field"><label>بداية العقد</label><input id="huStart" class="input" type="date"></div><div class="field"><label>نهاية العقد</label><input id="huEnd" class="input" type="date"></div>
    <div class="field" style="grid-column:1/-1"><label>العنوان</label><input id="huAddress" class="input"></div><div class="field" style="grid-column:1/-1"><label>ملاحظات</label><textarea id="huNotes" class="input" rows="3"></textarea></div>
  </div><button id="saveHousingUnitBtn" class="btn btn-primary">حفظ الوحدة</button></div></div>
  <div id="housingResidentModal" class="modal"><div class="modal-card"><div class="modal-head"><h3>إضافة ساكن</h3><button class="close" data-hclose="housingResidentModal">×</button></div><div class="housing-form-grid">
    <div class="field"><label>الوحدة</label><select id="hrUnit" class="input"></select></div><div class="field"><label>اسم الساكن</label><input id="hrName" class="input"></div>
    <div class="field"><label>Rider ID</label><input id="hrRider" class="input"></div><div class="field"><label>التليفون</label><input id="hrPhone" class="input"></div>
    <div class="field"><label>تاريخ الدخول</label><input id="hrStart" class="input" type="date"></div><div class="field"><label>نظام السكن</label><select id="hrBilling" class="input"><option value="FREE">مجاني</option><option value="PARTIAL">مساهمة جزئية</option><option value="PAID">مدفوع</option></select></div>
    <div class="field"><label>المساهمة الشهرية</label><input id="hrCharge" class="input" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>ملاحظات</label><input id="hrNotes" class="input"></div>
  </div><button id="saveHousingResidentBtn" class="btn btn-primary">إضافة الساكن</button></div></div>
  <div id="housingPaymentModal" class="modal"><div class="modal-card"><div class="modal-head"><h3>تسجيل مصروف / إيجار</h3><button class="close" data-hclose="housingPaymentModal">×</button></div><div class="housing-form-grid">
    <div class="field"><label>الوحدة</label><select id="hpUnit" class="input"></select></div><div class="field"><label>الشهر</label><input id="hpMonth" class="input" type="month"></div>
    <div class="field"><label>النوع</label><select id="hpType" class="input"><option value="RENT">إيجار</option><option value="ELECTRICITY">كهرباء</option><option value="WATER">مياه</option><option value="GAS">غاز</option><option value="INTERNET">إنترنت</option><option value="MAINTENANCE">صيانة</option><option value="OTHER">أخرى</option></select></div><div class="field"><label>المستحق</label><input id="hpDue" class="input" type="number" min="0" step="0.01"></div>
    <div class="field"><label>المدفوع</label><input id="hpPaid" class="input" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>تاريخ الاستحقاق</label><input id="hpDueDate" class="input" type="date"></div>
    <div class="field"><label>مرجع الدفع</label><input id="hpRef" class="input"></div><div class="field"><label>ملاحظات</label><input id="hpNotes" class="input"></div>
  </div><button id="saveHousingPaymentBtn" class="btn btn-primary">حفظ</button></div></div>`);
    document.querySelectorAll('[data-hclose]').forEach(b=>b.onclick=()=>closeModal(b.dataset.hclose));
    document.getElementById('saveHousingUnitBtn').onclick=saveHousingUnit;
    document.getElementById('saveHousingResidentBtn').onclick=saveHousingResident;
    document.getElementById('saveHousingPaymentBtn').onclick=saveHousingPayment;
  }

  function buildModuleNav(){
    if(!me)return;
    const defs=[
      ['dashboard','⌂','الرئيسية',true],
      ['orders','▤','الأوردرات',moduleEnabled('orders')],
      ['housing','⌂','السكن',moduleEnabled('housing')&&housingAllowed()],
      ['zones','⌖','التشغيل',moduleEnabled('operations')&&me.role!=='SUPERVISOR'],
      ['users','♟','المستخدمون',moduleEnabled('admin')&&admin()]
    ].filter(x=>x[3]);
    const nav=document.getElementById('desktopNav'); if(nav){nav.innerHTML=defs.map(x=>`<button data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
    const mob=document.getElementById('mobileNav');if(mob){const m=defs.filter(x=>['dashboard','orders','housing'].includes(x[0])).slice(0,4);mob.innerHTML=m.map(x=>`<button data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');mob.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
  }

  buildNav=function(){ensureSections();buildModuleNav();go('dashboard')};
  go=function(x){
    ensureSections();
    if(x==='dashboard'){visibleSection('sec-dashboard');setHeader('لوحة التحكم','نظرة عامة على منظومة 007');setNavActive('dashboard');renderModuleLauncher();}
    else if(x==='orders'||['overview','cases','review','new','company','refunds'].includes(x)){showOrderTab(x==='orders'?currentOrderTab:x)}
    else if(x==='housing'){showHousingTab(currentHousingTab)}
    else if(x==='zones'){visibleSection('sec-zones');setHeader('التشغيل','إدارة الزونات ومناطق التشغيل');setNavActive('zones');renderZones()}
    else if(x==='users'){visibleSection('sec-users');setHeader('المستخدمون','الحسابات والصلاحيات وربط الزونات');setNavActive('users');loadUsers()}
    window.scrollTo({top:0,behavior:'smooth'});
  };

  async function loadModuleData(){
    try{appModules=await api('app_modules?select=*&order=sort_order.asc')||[]}catch(_){appModules=[]}
    if(housingAllowed()){
      try{
        const jobs=[api('housing_units?select=*&order=created_at.desc'),api('housing_residents?select=*&order=created_at.desc')];
        if(financeAllowed())jobs.push(api('housing_payments?select=*&order=period_month.desc,created_at.desc'));
        const r=await Promise.all(jobs);housingUnits=r[0]||[];housingResidents=r[1]||[];housingPayments=financeAllowed()?(r[2]||[]):[];
      }catch(e){console.warn('housing load',e)}
    }
  }
  refreshAll=async function(){await baseRefreshAll();await loadModuleData();buildModuleNav();renderModuleLauncher();renderOrdersOverview();if(housingAllowed())renderHousing()};

  function renderModuleLauncher(){const sec=document.getElementById('sec-dashboard');if(!sec||!me)return;let wrap=document.getElementById('moduleLauncherV120');if(!wrap){wrap=document.createElement('div');wrap.id='moduleLauncherV120';sec.insertBefore(wrap,sec.firstChild)}const defs=[
    ['orders','▤','الأوردرات','رفع ومراجعة ومتابعة ردود الشركة'],['housing','⌂','السكن','الشقق والسكان والإيجارات'],['zones','⌖','التشغيل','الزونات ومناطق التشغيل'],['users','♟','الإدارة','المستخدمون والصلاحيات']
  ].filter(x=>(x[0]!=='housing'||housingAllowed())&&(x[0]!=='zones'||me.role!=='SUPERVISOR')&&(x[0]!=='users'||admin())&&(x[0]!=='orders'||moduleEnabled('orders'))&&(x[0]!=='housing'||moduleEnabled('housing')));wrap.innerHTML=`<div class="module-launcher">${defs.map(x=>`<button class="module-card" type="button" onclick="go('${x[0]}')"><i>${x[1]}</i><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>`}

  function showOrderTab(tab){currentOrderTab=tab;const map={overview:'sec-orders-overview',cases:'sec-cases',review:'sec-review',new:'sec-new',company:'sec-orders-company',refunds:'sec-orders-refunds'};visibleSection(map[tab]||map.overview);setHeader('الأوردرات','كل دورة الأوردر في مكان واحد');setNavActive('orders');document.querySelectorAll('[data-order-tabs]').forEach(x=>x.outerHTML=orderTabs(tab));if(tab==='overview')renderOrdersOverview();if(tab==='cases')renderCases();if(tab==='review')renderReview();if(tab==='company')renderOrdersCompany();if(tab==='refunds')renderOrdersRefunds();bindDynamicTabs()}
  function renderOrdersOverview(){const el=document.getElementById('ordersOverviewBody');if(!el)return;const total=cases.length,reviewN=cases.filter(c=>c.status==='UNDER_REVIEW').length,submitted=cases.filter(c=>c.status==='SUBMITTED').length,accepted=cases.filter(c=>['COMPANY_APPROVED','REFUND_PENDING','REFUNDED'].includes(c.status)).length,rejected=cases.filter(c=>c.status==='COMPANY_REJECTED').length,refund=cases.filter(c=>c.status==='REFUND_PENDING').length;el.innerHTML=orderTabs('overview')+`<div class="cards"><div class="card kpi"><small>إجمالي الأوردرات</small><b>${total}</b></div><div class="card kpi"><small>تحت المراجعة</small><b>${reviewN}</b></div><div class="card kpi"><small>بانتظار الشركة</small><b>${submitted}</b></div><div class="card kpi"><small>مقبول</small><b>${accepted}</b></div></div><div class="panel"><div class="panel-head"><h3>مسار الأوردرات</h3></div><div class="company-summary"><div class="company-stat"><small>مرفوض من الشركة</small><b>${rejected}</b></div><div class="company-stat"><small>بانتظار الاسترداد</small><b>${refund}</b></div></div></div><div class="panel"><div class="panel-head"><h3>أحدث الأوردرات</h3></div>${caseMarkup(cases.slice(0,8))}</div>`;bindDynamicTabs()}
  function renderOrdersCompany(){const el=document.getElementById('ordersCompanyBody');if(!el)return;const rows=cases.filter(c=>c.status==='SUBMITTED'||c.company_result||c.company_comment);el.innerHTML=orderTabs('company')+`<div class="panel"><div class="panel-head"><h3>ردود الشركة</h3><span class="badge">${rows.length} حالة</span></div>${rows.length?rows.map(c=>`<div class="order-company-row"><div><small>الأوردر</small><b>${htmlEsc(c.order_id)}</b></div><div><small>الزون</small><b>${htmlEsc(c.zones?.name_ar||'—')}</b></div><div><small>النتيجة</small><b>${htmlEsc(c.company_result||'بانتظار الرد')}</b></div><div><small>تعليق الشركة</small><b>${htmlEsc(c.company_comment||'—')}</b></div><button class="mini-btn gold" onclick="openCase('${c.id}')">تفاصيل</button></div>`).join(''):'<div class="module-empty">لا توجد ردود شركة حتى الآن</div>'}</div>`;bindDynamicTabs()}
  function renderOrdersRefunds(){const el=document.getElementById('ordersRefundBody');if(!el)return;const rows=cases.filter(c=>c.refund_status!=='NOT_APPLICABLE'||['REFUND_PENDING','REFUNDED'].includes(c.status));el.innerHTML=orderTabs('refunds')+`<div class="panel"><div class="panel-head"><h3>الاسترداد</h3><span class="badge">${rows.length} حالة</span></div>${rows.length?caseMarkup(rows):'<div class="module-empty">لا توجد حالات استرداد حتى الآن</div>'}</div>`;bindDynamicTabs()}

  function housingOccupancy(unitId){return housingResidents.filter(r=>r.unit_id===unitId&&r.status==='ACTIVE').length}
  function showHousingTab(tab){if(!housingAllowed())return toast('هذه الوحدة غير متاحة لحسابك',true);currentHousingTab=(tab==='payments'&&!financeAllowed())?'overview':tab;visibleSection('sec-housing');setHeader('السكن','إدارة الشقق والسكان والمصروفات');setNavActive('housing');renderHousing();window.scrollTo({top:0,behavior:'smooth'})}
  function renderHousing(){const el=document.getElementById('housingBody');if(!el||!housingAllowed())return;let body='';if(currentHousingTab==='overview')body=renderHousingOverviewHtml();else if(currentHousingTab==='units')body=renderHousingUnitsHtml();else if(currentHousingTab==='residents')body=renderHousingResidentsHtml();else body=renderHousingPaymentsHtml();el.innerHTML=housingTabs(currentHousingTab)+body;bindDynamicTabs();bindHousingActions()}
  function renderHousingOverviewHtml(){const activeUnits=housingUnits.filter(u=>u.status==='ACTIVE'),cap=activeUnits.reduce((a,u)=>a+Number(u.capacity||0),0),occ=housingResidents.filter(r=>r.status==='ACTIVE').length,free=Math.max(0,cap-occ),rent=activeUnits.reduce((a,u)=>a+Number(u.monthly_rent||0),0),due=housingPayments.filter(p=>['DUE','PARTIAL'].includes(p.status)).length;return `<div class="housing-kpis"><div class="housing-kpi"><small>الوحدات النشطة</small><b>${activeUnits.length}</b></div><div class="housing-kpi"><small>السعة</small><b>${cap}</b></div><div class="housing-kpi"><small>السكان</small><b>${occ}</b></div><div class="housing-kpi"><small>أماكن متاحة</small><b>${free}</b></div><div class="housing-kpi"><small>إيجار شهري</small><b>${money(rent)}</b></div></div><div class="panel"><div class="panel-head"><h3>نظرة على السكن</h3><button class="btn btn-secondary" data-housing-add-unit>+ إضافة شقة</button></div>${housingUnits.length?`<div class="house-grid">${housingUnits.slice(0,6).map(unitCard).join('')}</div>`:'<div class="module-empty">ابدأ بإضافة أول شقة — مثل شقق الغردقة</div>'}</div>${financeAllowed()?`<div class="housing-note">المصروفات غير المسددة حاليًا: <b>${due}</b>. من تابة «المدفوعات» تقدر تسجل الإيجار والكهرباء والمياه والصيانة لكل شقة.</div>`:''}`}
  function unitCard(u){const occ=housingOccupancy(u.id);return `<div class="house-card"><div class="house-head"><div><b>${htmlEsc(u.name)}</b><small>${htmlEsc(zoneName(u.zone_id))}${u.code?' · '+htmlEsc(u.code):''}</small></div><span class="badge ${u.status==='ACTIVE'?'green':''}">${htmlEsc(u.status)}</span></div><div class="house-meta"><div><small>الإيجار</small><b>${money(u.monthly_rent)}</b></div><div><small>الإشغال</small><b>${occ} / ${u.capacity}</b></div><div><small>العقد حتى</small><b>${htmlEsc(u.contract_end||'—')}</b></div><div><small>المالك</small><b>${htmlEsc(u.landlord_name||'—')}</b></div></div><div class="house-actions"><button class="mini-btn gold" data-edit-unit="${u.id}">تعديل</button><button class="mini-btn" data-add-resident-unit="${u.id}">+ ساكن</button>${financeAllowed()?`<button class="mini-btn" data-add-payment-unit="${u.id}">+ مصروف</button>`:''}</div></div>`}
  function renderHousingUnitsHtml(){return `<div class="panel"><div class="panel-head"><h3>الشقق والوحدات</h3><button class="btn btn-secondary" data-housing-add-unit>+ إضافة وحدة</button></div>${housingUnits.length?`<div class="house-grid">${housingUnits.map(unitCard).join('')}</div>`:'<div class="module-empty">لا توجد وحدات سكنية مسجلة</div>'}</div>`}
  function renderHousingResidentsHtml(){const rows=housingResidents;return `<div class="panel"><div class="panel-head"><h3>السكان</h3><button class="btn btn-secondary" data-housing-add-resident>+ إضافة ساكن</button></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>Rider ID</th><th>الوحدة</th><th>من</th><th>النظام</th><th>المساهمة</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${htmlEsc(r.resident_name)}</td><td>${htmlEsc(r.rider_id||'—')}</td><td>${htmlEsc(unitName(r.unit_id))}</td><td>${htmlEsc(r.start_date)}</td><td>${htmlEsc({FREE:'مجاني',PARTIAL:'جزئي',PAID:'مدفوع'}[r.billing_mode]||r.billing_mode)}</td><td>${money(r.monthly_charge)}</td><td>${htmlEsc(r.status)}</td><td>${r.status==='ACTIVE'?`<button class="mini-btn bad" data-end-resident="${r.id}">إنهاء السكن</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="module-empty">لا يوجد سكان مسجلون</div>'}</div>`}
  function renderHousingPaymentsHtml(){if(!financeAllowed())return '<div class="finance-hidden">البيانات المالية متاحة للإدارة والمراجعين فقط.</div>';return `<div class="panel"><div class="panel-head"><h3>الإيجارات والمصروفات</h3><button class="btn btn-secondary" data-housing-add-payment>+ تسجيل مصروف</button></div>${housingPayments.length?`<div class="table-wrap"><table><thead><tr><th>الشهر</th><th>الوحدة</th><th>النوع</th><th>المستحق</th><th>المدفوع</th><th>الحالة</th><th></th></tr></thead><tbody>${housingPayments.map(p=>`<tr><td>${htmlEsc(String(p.period_month).slice(0,7))}</td><td>${htmlEsc(unitName(p.unit_id))}</td><td>${htmlEsc({RENT:'إيجار',ELECTRICITY:'كهرباء',WATER:'مياه',GAS:'غاز',INTERNET:'إنترنت',MAINTENANCE:'صيانة',OTHER:'أخرى'}[p.expense_type]||p.expense_type)}</td><td>${money(p.amount_due)}</td><td>${money(p.amount_paid)}</td><td>${htmlEsc(p.status)}</td><td>${p.status!=='PAID'&&p.status!=='CANCELLED'?`<button class="mini-btn gold" data-pay-full="${p.id}">تم السداد</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="module-empty">لا توجد مدفوعات مسجلة</div>'}</div>`}

  function bindHousingActions(){document.querySelectorAll('[data-housing-add-unit]').forEach(b=>b.onclick=()=>openUnitModal());document.querySelectorAll('[data-edit-unit]').forEach(b=>b.onclick=()=>openUnitModal(b.dataset.editUnit));document.querySelectorAll('[data-housing-add-resident]').forEach(b=>b.onclick=()=>openResidentModal());document.querySelectorAll('[data-add-resident-unit]').forEach(b=>b.onclick=()=>openResidentModal(b.dataset.addResidentUnit));document.querySelectorAll('[data-housing-add-payment]').forEach(b=>b.onclick=()=>openPaymentModal());document.querySelectorAll('[data-add-payment-unit]').forEach(b=>b.onclick=()=>openPaymentModal(b.dataset.addPaymentUnit));document.querySelectorAll('[data-end-resident]').forEach(b=>b.onclick=()=>endResident(b.dataset.endResident));document.querySelectorAll('[data-pay-full]').forEach(b=>b.onclick=()=>markPaymentPaid(b.dataset.payFull))}
  function fillHousingUnitSelect(id,selected=''){const el=document.getElementById(id);if(!el)return;el.innerHTML=housingUnits.filter(u=>u.status==='ACTIVE').map(u=>`<option value="${u.id}" ${u.id===selected?'selected':''}>${htmlEsc(u.name)} — ${htmlEsc(zoneName(u.zone_id))}</option>`).join('')}
  function openUnitModal(id=''){const u=housingUnits.find(x=>x.id===id);document.getElementById('huId').value=id;document.getElementById('housingUnitTitle').textContent=u?'تعديل الوحدة':'إضافة شقة / وحدة';document.getElementById('huZone').innerHTML=zones.map(z=>`<option value="${z.id}" ${u?.zone_id===z.id?'selected':''}>${htmlEsc(z.name_ar)}</option>`).join('');document.getElementById('huName').value=u?.name||'';document.getElementById('huCode').value=u?.code||'';document.getElementById('huType').value=u?.unit_type||'APARTMENT';document.getElementById('huRent').value=u?.monthly_rent||0;document.getElementById('huCapacity').value=u?.capacity||1;document.getElementById('huLandlord').value=u?.landlord_name||'';document.getElementById('huPhone').value=u?.landlord_phone||'';document.getElementById('huStart').value=u?.contract_start||'';document.getElementById('huEnd').value=u?.contract_end||'';document.getElementById('huAddress').value=u?.address||'';document.getElementById('huNotes').value=u?.notes||'';openModal('housingUnitModal')}
  function openResidentModal(unit=''){if(!housingUnits.length)return toast('أضف وحدة سكنية أولًا',true);fillHousingUnitSelect('hrUnit',unit);document.getElementById('hrName').value='';document.getElementById('hrRider').value='';document.getElementById('hrPhone').value='';document.getElementById('hrStart').value=today();document.getElementById('hrBilling').value='FREE';document.getElementById('hrCharge').value=0;document.getElementById('hrNotes').value='';openModal('housingResidentModal')}
  function openPaymentModal(unit=''){if(!housingUnits.length)return toast('أضف وحدة سكنية أولًا',true);fillHousingUnitSelect('hpUnit',unit);document.getElementById('hpMonth').value=today().slice(0,7);document.getElementById('hpType').value='RENT';document.getElementById('hpDue').value=unit?(housingUnits.find(x=>x.id===unit)?.monthly_rent||0):0;document.getElementById('hpPaid').value=0;document.getElementById('hpDueDate').value='';document.getElementById('hpRef').value='';document.getElementById('hpNotes').value='';openModal('housingPaymentModal')}

  async function saveHousingUnit(){const id=document.getElementById('huId').value,p={zone_id:document.getElementById('huZone').value,name:document.getElementById('huName').value.trim(),code:document.getElementById('huCode').value.trim()||null,unit_type:document.getElementById('huType').value,address:document.getElementById('huAddress').value.trim()||null,monthly_rent:Number(document.getElementById('huRent').value||0),capacity:Number(document.getElementById('huCapacity').value||1),landlord_name:document.getElementById('huLandlord').value.trim()||null,landlord_phone:document.getElementById('huPhone').value.trim()||null,contract_start:document.getElementById('huStart').value||null,contract_end:document.getElementById('huEnd').value||null,notes:document.getElementById('huNotes').value.trim()||null};if(!p.zone_id||!p.name)return toast('اختار الزون واكتب اسم الوحدة',true);try{if(id)await api('housing_units?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});else await api('housing_units',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({...p,created_by:me.id})});closeModal('housingUnitModal');toast('تم حفظ الوحدة ✅');await loadModuleData();renderHousing()}catch(e){toast(e.message,true)}}
  async function saveHousingResident(){const p={unit_id:document.getElementById('hrUnit').value,resident_name:document.getElementById('hrName').value.trim(),rider_id:document.getElementById('hrRider').value.trim()||null,phone:document.getElementById('hrPhone').value.trim()||null,start_date:document.getElementById('hrStart').value||today(),billing_mode:document.getElementById('hrBilling').value,monthly_charge:Number(document.getElementById('hrCharge').value||0),notes:document.getElementById('hrNotes').value.trim()||null,created_by:me.id};if(!p.unit_id||!p.resident_name)return toast('اختار الوحدة واكتب اسم الساكن',true);const u=housingUnits.find(x=>x.id===p.unit_id);if(u&&housingOccupancy(u.id)>=u.capacity)return toast('الوحدة وصلت للسعة القصوى',true);try{await api('housing_residents',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});closeModal('housingResidentModal');toast('تمت إضافة الساكن ✅');await loadModuleData();renderHousing()}catch(e){toast(e.message,true)}}
  async function endResident(id){if(!confirm('إنهاء سكن هذا الشخص؟'))return;try{await api('housing_residents?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'ENDED',end_date:today()})});toast('تم إنهاء السكن');await loadModuleData();renderHousing()}catch(e){toast(e.message,true)}}
  async function saveHousingPayment(){const due=Number(document.getElementById('hpDue').value||0),paid=Number(document.getElementById('hpPaid').value||0),status=paid>=due&&due>0?'PAID':paid>0?'PARTIAL':'DUE',month=document.getElementById('hpMonth').value;const p={unit_id:document.getElementById('hpUnit').value,period_month:month?month+'-01':null,expense_type:document.getElementById('hpType').value,amount_due:due,amount_paid:paid,due_date:document.getElementById('hpDueDate').value||null,paid_at:paid>0?today():null,status,payment_reference:document.getElementById('hpRef').value.trim()||null,notes:document.getElementById('hpNotes').value.trim()||null,recorded_by:me.id};if(!p.unit_id||!p.period_month)return toast('اختار الوحدة والشهر',true);try{await api('housing_payments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});closeModal('housingPaymentModal');toast('تم تسجيل المصروف ✅');await loadModuleData();renderHousing()}catch(e){toast(e.message,true)}}
  async function markPaymentPaid(id){const p=housingPayments.find(x=>x.id===id);if(!p)return;try{await api('housing_payments?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({amount_paid:p.amount_due,status:'PAID',paid_at:today()})});toast('تم تسجيل السداد ✅');await loadModuleData();renderHousing()}catch(e){toast(e.message,true)}}

  window.openHousingUnitV120=openUnitModal;
  window.showOrderTabV120=showOrderTab;
  window.showHousingTabV120=showHousingTab;
  ensureSections();
})();
</script>
