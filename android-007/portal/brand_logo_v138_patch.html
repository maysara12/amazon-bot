<style id="brandLogoV138Style">
.side-brand .mark.brand-logo-007,.auth-brand .mark.brand-logo-007{background-color:#0c1a2d;background-repeat:no-repeat;background-position:center;background-size:cover;color:transparent;overflow:hidden}
.side-brand .mark.brand-logo-007{border-color:#d8b25c80;box-shadow:0 4px 18px #0005}
.auth-brand .mark.brand-logo-007{border-color:#d8b25c80;box-shadow:0 8px 30px #0006}
/* Pin the global product brand even if the legacy base re-renders its old text. */
.side-brand b{font-size:0!important;letter-spacing:.35px}
.side-brand b::after{content:'OPERATIONS HUB';font-size:14px!important;color:var(--gold2);font-weight:800;white-space:nowrap}
.side-brand small{font-size:0!important}
.side-brand small::after{content:'Integrated Operations Management';font-size:10.5px!important;color:var(--muted);white-space:nowrap}
/* Compact executive shortcuts on the dashboard only. */
#moduleLauncherV120 .module-launcher{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;margin:0 0 14px!important}
#moduleLauncherV120 .module-card{min-height:82px!important;padding:11px 13px!important;border-radius:14px!important;display:grid!important;grid-template-columns:34px minmax(0,1fr)!important;grid-template-rows:auto auto!important;column-gap:10px!important;row-gap:1px!important;align-items:center!important}
#moduleLauncherV120 .module-card i{width:34px!important;height:34px!important;border-radius:9px!important;font-size:16px!important;margin:0!important;grid-row:1/3!important;grid-column:1!important}
#moduleLauncherV120 .module-card b{font-size:14px!important;line-height:1.3!important;grid-column:2!important}
#moduleLauncherV120 .module-card small{font-size:10.5px!important;line-height:1.35!important;margin:0!important;grid-column:2!important;color:#879bb2!important}
@media(max-width:900px){#moduleLauncherV120 .module-launcher{grid-template-columns:1fr 1fr!important}}
@media(max-width:620px){#moduleLauncherV120 .module-launcher{grid-template-columns:1fr!important}#moduleLauncherV120 .module-card{min-height:70px!important}}
</style>
<script id="brandLogoV138Script" data-brand-version="1.5.2">
(function(){
  'use strict';
  const ROOT='https://raw.githubusercontent.com/maysara12/amazon-bot/007-operations-android/android-007/icon/';
  const parts=['ic_launcher.webp.b64.part1','ic_launcher.webp.b64.part2','ic_launcher.webp.b64.part3','ic_launcher.webp.b64.part4'];

  function applyUnifiedBrand(){
    document.title='007 Operations Hub';
    const side=document.querySelector('.side-brand');
    if(side){
      const title=side.querySelector('b');
      const sub=side.querySelector('small');
      if(title)title.textContent='OPERATIONS HUB';
      if(sub)sub.textContent='Integrated Operations Management';
    }
    const auth=document.querySelector('.auth-brand');
    if(auth){
      const h1=auth.querySelector('h1');
      const p=auth.querySelector('p');
      if(h1)h1.innerHTML='منظومة <span>عمليات 007</span>';
      if(p)p.textContent='منصة موحدة لإدارة ومتابعة عمليات 007 والموديولات التشغيلية من مكان واحد.';
      const points=auth.querySelectorAll('.brand-point');
      const labels=[
        ['✓','صلاحيات منظمة حسب الدور والزونات'],
        ['▣','موديولات تشغيلية موحدة في منصة واحدة'],
        ['↻','متابعة وتحديثات لحظية للعمليات']
      ];
      points.forEach((el,i)=>{
        if(!labels[i])return;
        const icon=el.querySelector('i');
        if(icon)icon.textContent=labels[i][0];
        const text=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);
        if(text)text.textContent=' '+labels[i][1];
        else el.append(document.createTextNode(' '+labels[i][1]));
      });
    }
  }

  async function loadLogo(){
    applyUnifiedBrand();
    try{
      const chunks=await Promise.all(parts.map(async n=>{const r=await fetch(ROOT+n,{cache:'force-cache'});if(!r.ok)throw new Error('logo '+r.status);return r.text()}));
      const b64=chunks.join('').replace(/\s+/g,'');
      if(b64.length<50000)throw new Error('logo data incomplete');
      const src='data:image/webp;base64,'+b64;
      document.querySelectorAll('.side-brand .mark,.auth-brand .mark').forEach(el=>{
        el.classList.add('brand-logo-007');
        el.textContent='';
        el.style.backgroundImage=`url("${src}")`;
        el.setAttribute('aria-label','007 Operations Hub');
      });
      let fav=document.querySelector('link[rel="icon"]');
      if(!fav){fav=document.createElement('link');fav.rel='icon';document.head.appendChild(fav)}
      fav.type='image/webp';fav.href=src;
    }catch(e){console.warn('007 brand logo unavailable',e)}
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadLogo,{once:true});else loadLogo();
})();
</script>
