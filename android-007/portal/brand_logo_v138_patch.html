<style id="brandLogoV138Style">
.side-brand .mark.brand-logo-007,.auth-brand .mark.brand-logo-007{background-color:#0c1a2d;background-repeat:no-repeat;background-position:center;background-size:cover;color:transparent;overflow:hidden}
.side-brand .mark.brand-logo-007{border-color:#d8b25c80;box-shadow:0 4px 18px #0005}
.auth-brand .mark.brand-logo-007{border-color:#d8b25c80;box-shadow:0 8px 30px #0006}
.side-brand b{font-size:0!important;letter-spacing:.35px}
.side-brand b::after{content:'OPERATIONS HUB';font-size:14px!important;color:var(--gold2);font-weight:800;white-space:nowrap}
.side-brand small{font-size:0!important}
.side-brand small::after{content:'Integrated Operations Management';font-size:10.5px!important;color:var(--muted);white-space:nowrap}
#moduleLauncherV120 .module-launcher{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;margin:0 0 14px!important}
#moduleLauncherV120 .module-card{min-height:82px!important;padding:11px 13px!important;border-radius:14px!important;display:grid!important;grid-template-columns:34px minmax(0,1fr)!important;grid-template-rows:auto auto!important;column-gap:10px!important;row-gap:1px!important;align-items:center!important}
#moduleLauncherV120 .module-card i{width:34px!important;height:34px!important;border-radius:9px!important;font-size:16px!important;margin:0!important;grid-row:1/3!important;grid-column:1!important}
#moduleLauncherV120 .module-card b{font-size:14px!important;line-height:1.3!important;grid-column:2!important}
#moduleLauncherV120 .module-card small{font-size:10.5px!important;line-height:1.35!important;margin:0!important;grid-column:2!important;color:#879bb2!important}
.zone-remove-v153{margin-top:12px;border:1px solid #6f3039;background:#351821;color:#ffb3bb;border-radius:9px;padding:7px 10px;font-weight:800;font-size:12px}.zone-remove-v153:hover{background:#4a1e29;border-color:#964253}
@media(max-width:900px){#moduleLauncherV120 .module-launcher{grid-template-columns:1fr 1fr!important}}
@media(max-width:620px){#moduleLauncherV120 .module-launcher{grid-template-columns:1fr!important}#moduleLauncherV120 .module-card{min-height:70px!important}}
</style>
<script id="brandLogoV138Script" data-brand-version="1.5.4">
(function(){
  'use strict';
  const ROOT='https://raw.githubusercontent.com/maysara12/amazon-bot/007-operations-android/android-007/icon/';
  const parts=['ic_launcher.webp.b64.part1','ic_launcher.webp.b64.part2','ic_launcher.webp.b64.part3','ic_launcher.webp.b64.part4'];
  const isAdmin=()=>!!me&&(['OWNER','ADMIN'].includes(me.role)||me.can_manage_users===true);

  function applyUnifiedBrand(){
    document.title='007 Operations Hub';
    const side=document.querySelector('.side-brand');
    if(side){const title=side.querySelector('b'),sub=side.querySelector('small');if(title)title.textContent='OPERATIONS HUB';if(sub)sub.textContent='Integrated Operations Management'}
    const auth=document.querySelector('.auth-brand');
    if(auth){
      const h1=auth.querySelector('h1'),p=auth.querySelector('p');
      if(h1)h1.innerHTML='منظومة <span>عمليات 007</span>';
      if(p)p.textContent='منصة موحدة لإدارة ومتابعة عمليات 007 والموديولات التشغيلية من مكان واحد.';
      const points=auth.querySelectorAll('.brand-point'),labels=[['✓','صلاحيات منظمة حسب الدور والزونات'],['▣','موديولات تشغيلية موحدة في منصة واحدة'],['↻','متابعة وتحديثات لحظية للعمليات']];
      points.forEach((el,i)=>{if(!labels[i])return;const icon=el.querySelector('i');if(icon)icon.textContent=labels[i][0];const text=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);if(text)text.textContent=' '+labels[i][1];else el.append(document.createTextNode(' '+labels[i][1]))});
    }
  }

  function decorateZoneRemoval(){
    if(!isAdmin()||!Array.isArray(zones))return;
    const list=document.getElementById('zonesList');if(!list)return;
    const cards=[...list.querySelectorAll('.grid3 > .card')];
    cards.forEach((card,i)=>{
      const z=zones[i];if(!z||card.querySelector('[data-zone-archive-v153]'))return;
      const b=document.createElement('button');b.type='button';b.className='zone-remove-v153';b.dataset.zoneArchiveV153=z.id;b.dataset.zoneNameV153=z.name_ar||z.name_en||z.code||'الزون';b.textContent='إزالة الزون';card.appendChild(b);
    });
  }

  async function archiveZone(id,name,btn){
    if(!isAdmin())return toast('إزالة الزونات متاحة للإدارة فقط',true);
    if(!confirm(`إزالة زون «${name}» من التشغيل؟\n\nسيختفي من القوائم الجديدة فقط، ولن تُحذف السجلات التاريخية.`))return;
    btn.disabled=true;
    try{await api('rpc/archive_zone',{method:'POST',body:JSON.stringify({p_zone_id:id})});toast('تمت إزالة الزون من التشغيل ✅');await refreshAll();if(document.getElementById('sec-zones')?.classList.contains('active')){renderZones();decorateZoneRemoval()}}
    catch(e){toast(e.message||'تعذر إزالة الزون',true)}finally{btn.disabled=false}
  }

  async function loadLogo(){
    applyUnifiedBrand();
    try{
      const chunks=await Promise.all(parts.map(async n=>{const r=await fetch(ROOT+n,{cache:'force-cache'});if(!r.ok)throw new Error('logo '+r.status);return r.text()}));
      const b64=chunks.join('').replace(/\s+/g,'');if(b64.length<50000)throw new Error('logo data incomplete');const src='data:image/webp;base64,'+b64;
      document.querySelectorAll('.side-brand .mark,.auth-brand .mark').forEach(el=>{el.classList.add('brand-logo-007');el.textContent='';el.style.backgroundImage=`url("${src}")`;el.setAttribute('aria-label','007 Operations Hub')});
      let fav=document.querySelector('link[rel="icon"]');if(!fav){fav=document.createElement('link');fav.rel='icon';document.head.appendChild(fav)}fav.type='image/webp';fav.href=src;
    }catch(e){console.warn('007 brand logo unavailable',e)}
  }

  async function loadHousingSupervisorAssignments(){
    if(window.__housingSupervisorAssignmentV153||document.getElementById('housingSupervisorAssignmentV153Script'))return;
    try{
      const url='https://raw.githubusercontent.com/maysara12/amazon-bot/007-operations-android/android-007/portal/housing_supervisor_assignment_v153_patch.html?v='+Date.now();
      const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();
      const doc=new DOMParser().parseFromString(html,'text/html');
      doc.querySelectorAll('style').forEach(s=>{if(!document.getElementById(s.id)){const n=document.createElement('style');n.id=s.id;n.textContent=s.textContent;document.head.appendChild(n)}});
      const src=doc.querySelector('#housingSupervisorAssignmentV153Script');if(src&&!document.getElementById('housingSupervisorAssignmentV153Script')){const n=document.createElement('script');n.id='housingSupervisorAssignmentV153Script';n.textContent=src.textContent;document.body.appendChild(n)}
    }catch(e){console.warn('housing supervisor assignment live load failed',e)}
  }

  document.addEventListener('click',e=>{
    const b=e.target instanceof Element?e.target.closest('[data-zone-archive-v153]'):null;if(b){e.preventDefault();e.stopPropagation();archiveZone(b.dataset.zoneArchiveV153,b.dataset.zoneNameV153,b);return}
    const z=e.target instanceof Element?e.target.closest('[data-go="zones"]'):null;if(z)setTimeout(decorateZoneRemoval,120);
  },true);
  const baseRenderZones=window.renderZones;if(typeof baseRenderZones==='function')window.renderZones=function(){const r=baseRenderZones.apply(this,arguments);decorateZoneRemoval();return r};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{loadLogo();setTimeout(loadHousingSupervisorAssignments,80)},{once:true});else{loadLogo();setTimeout(loadHousingSupervisorAssignments,80)}
})();
</script>
