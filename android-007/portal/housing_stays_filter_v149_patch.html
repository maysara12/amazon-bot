<style id="housingStaysFilterV149Style">
.hh149-filter{margin:0 0 14px;padding:12px;background:linear-gradient(145deg,#0b1d30,#091827);border:1px solid #223b58;border-radius:15px;box-shadow:0 10px 28px #0002}.hh149-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hh149-search{display:flex;align-items:center;gap:8px;min-width:260px;flex:1;background:#071522;border:1px solid #29435f;border-radius:11px;padding:0 11px}.hh149-search span{color:#d8b25c;font-size:18px}.hh149-search input{width:100%;height:40px;border:0;outline:0;background:transparent;color:#fff;font:13px Tahoma,Arial,sans-serif}.hh149-search input::placeholder{color:#71869f}.hh149-clear{border:1px solid #304a68;background:#10243a;color:#a9bdd2;border-radius:10px;padding:9px 12px;font-weight:700}.hh149-units{display:flex;gap:7px;overflow-x:auto;padding:10px 1px 3px;scrollbar-width:thin}.hh149-unit{display:flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid #2d4663;background:#0f2338;color:#c9d6e4;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px}.hh149-unit:hover{border-color:#6c5b32}.hh149-unit.active{background:#d8b25c;color:#07111f;border-color:#d8b25c}.hh149-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#ffffff12;color:inherit;font-size:11px}.hh149-unit.active .hh149-count{background:#07111f22}.hh149-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px;color:#8297ae;font-size:11px}.hh149-foot b{color:#e2c674}.hh149-empty{padding:24px;text-align:center;color:#8ea2b8;border:1px dashed #29415d;border-radius:12px;margin-top:10px;background:#081725}@media(max-width:720px){.hh149-filter{padding:10px}.hh149-search{min-width:100%;order:1}.hh149-clear{order:2}.hh149-units{margin-left:-2px;margin-right:-2px}.hh149-foot{display:block;line-height:1.8}.hh149-unit{padding:7px 10px}}
</style>
<script id="housingStaysFilterV149Script" data-version="1.4.9">
(function(){
'use strict';
if(window.__housingStaysFilterV149)return;window.__housingStaysFilterV149=true;
let selectedUnit='ALL',searchTerm='',busy=false;
const norm=v=>String(v??'').toLowerCase().replace(/\s+/g,' ').trim();
function getPanel(){
 const root=document.getElementById('hh132Body');if(!root)return null;
 return [...root.querySelectorAll('.panel')].find(p=>p.querySelector('.panel-head h3')?.textContent.trim()==='الساكنين حاليًا')||null;
}
function rowMeta(tr){
 const cells=tr.cells||[];
 const name=(cells[0]?.textContent||'').trim();
 const rider=(cells[1]?.textContent||'').trim();
 const unit=(cells[2]?.textContent||'').trim();
 return {name,rider,unit,search:norm(name+' '+rider+' '+unit)};
}
function applyFilter(){
 const panel=getPanel();if(!panel)return;
 const rows=[...(panel.querySelector('.hh132-table tbody')?.rows||[])];
 const q=norm(searchTerm);let shown=0;
 rows.forEach(tr=>{
  const m=rowMeta(tr);
  const unitOk=selectedUnit==='ALL'||m.unit===selectedUnit;
  const searchOk=!q||m.search.includes(q);
  const show=unitOk&&searchOk;
  tr.style.display=show?'':'none';if(show)shown++;
 });
 const summary=panel.querySelector('[data-hh149-summary]');
 if(summary){
  const unitText=selectedUnit==='ALL'?'كل الشقق':selectedUnit;
  summary.innerHTML=`عرض <b>${shown}</b> من <b>${rows.length}</b> مندوب — ${unitText}`;
 }
 let empty=panel.querySelector('.hh149-empty');
 if(!shown&&rows.length){if(!empty){empty=document.createElement('div');empty.className='hh149-empty';empty.textContent='لا يوجد مندوبون مطابقون للفلتر الحالي';panel.appendChild(empty)}}else empty?.remove();
 panel.querySelectorAll('[data-hh149-unit]').forEach(b=>b.classList.toggle('active',b.dataset.hh149Unit===selectedUnit));
}
function decorate(){
 if(busy)return;busy=true;
 try{
  const panel=getPanel();if(!panel)return;
  const table=panel.querySelector('.hh132-table');if(!table)return;
  const rows=[...(table.tBodies?.[0]?.rows||[])];
  const counts=new Map();rows.forEach(tr=>{const u=rowMeta(tr).unit;if(u)counts.set(u,(counts.get(u)||0)+1)});
  const units=[...counts.keys()].sort((a,b)=>a.localeCompare(b,'ar'));
  if(selectedUnit!=='ALL'&&!counts.has(selectedUnit))selectedUnit='ALL';
  let bar=panel.querySelector('.hh149-filter');
  if(!bar){
   bar=document.createElement('div');bar.className='hh149-filter';
   panel.querySelector('.panel-head')?.insertAdjacentElement('afterend',bar);
  }
  bar.innerHTML='<div class="hh149-top"><label class="hh149-search"><span>⌕</span><input data-hh149-search type="search" placeholder="بحث بالاسم أو Rider ID أو اسم الشقة"></label><button class="hh149-clear" data-hh149-clear>مسح الفلتر</button></div><div class="hh149-units" data-hh149-units></div><div class="hh149-foot"><span data-hh149-summary></span><span>اضغط على اسم الشقة لعرض سكانها فقط</span></div>';
  const input=bar.querySelector('[data-hh149-search]');input.value=searchTerm;
  input.addEventListener('input',()=>{searchTerm=input.value;applyFilter()});
  bar.querySelector('[data-hh149-clear]').onclick=()=>{selectedUnit='ALL';searchTerm='';input.value='';applyFilter()};
  const strip=bar.querySelector('[data-hh149-units]');
  const addChip=(name,label,count)=>{
   const b=document.createElement('button');b.type='button';b.className='hh149-unit';b.dataset.hh149Unit=name;
   const text=document.createElement('span');text.textContent=label;const badge=document.createElement('span');badge.className='hh149-count';badge.textContent=count;
   b.append(text,badge);b.onclick=()=>{selectedUnit=name;applyFilter()};strip.appendChild(b);
  };
  addChip('ALL','الكل',rows.length);
  units.forEach(u=>addChip(u,u,counts.get(u)||0));
  applyFilter();
 }finally{busy=false}
}
document.addEventListener('click',e=>{const t=e.target instanceof Element?e.target.closest('[data-hht="stays"]'):null;if(t)setTimeout(decorate,140)},true);
const prevRefresh=window.refreshAll;
if(typeof prevRefresh==='function')window.refreshAll=async function(){const r=await prevRefresh.apply(this,arguments);setTimeout(decorate,160);return r};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(decorate,300),{once:true});else setTimeout(decorate,300);
})();
</script>
