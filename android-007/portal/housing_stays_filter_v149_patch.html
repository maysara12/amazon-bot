margin-left:-2px;margin-right:-2px}.hh149-foot{display:block;line-height:1.8}.hh149-unit{padding:7px 10px}}

<script id="housingStaysFilterV149Script" data-version="1.5.1">
(function(){
'use strict';
if(window.__housingStaysFilterV149)return;window.__housingStaysFilterV149=true;
let selectedUnit='ALL',searchTerm='',busy=false;
const norm=v=>String(v??'').toLowerCase().replace(/\s+/g,' ').trim();
function getPanel(){
 const root=document.getElementById('hh132Body');if(!root)return null;
 return [...root.querySelectorAll('.panel')].find(p=>p.querySelector('.panel-head h3')?.textContent.trim()==='الساكنين حاليًا')||null;
}
function rowMeta(tr){
 const cells=tr.cells||[];
 const name=(cells[0]?.textContent||'').trim();
 const rider=(cells[1]?.textContent||'').trim();
 const unit=(cells[2]?.textContent||'').trim();
 return {name,rider,unit,search:norm(name+' '+rider+' '+unit)};
}
function applyFilter(){
 const panel=getPanel();if(!panel)return;
 const rows=[...(panel.querySelector('.hh132-table tbody')?.rows||[])];
 const q=norm(searchTerm);let shown=0;
 rows.forEach(tr=>{
  const m=rowMeta(tr);
  const unitOk=selectedUnit==='ALL'||m.unit===selectedUnit;
  const searchOk=!q||m.search.includes(q);
  const show=unitOk&&searchOk;
  tr.style.display=show?'':'none';if(show)shown++;
 });
 const summary=panel.querySelector('[data-hh149-summary]');
 if(summary){
  const unitText=selectedUnit==='ALL'?'كل الشقق':selectedUnit;
  summary.innerHTML=`عرض <b>${shown}</b> من <b>${rows.length}</b> مندوب — ${unitText}`;
 }
 let empty=panel.querySelector('.hh149-empty');
 if(!shown&&rows.length){if(!empty){empty=document.createElement('div');empty.className='hh149-empty';empty.textContent='لا يوجد مندوبون مطابقون للفلتر الحالي';panel.appendChild(empty)}}else empty?.remove();
 panel.querySelectorAll('[data-hh149-unit]').forEach(b=>b.classList.toggle('active',b.dataset.hh149Unit===selectedUnit));
}

async function ensureExcelJS(){
 if(window.ExcelJS)return window.ExcelJS;
 if(window.__hh149ExcelPromise)return window.__hh149ExcelPromise;
 window.__hh149ExcelPromise=new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
  s.onload=()=>window.ExcelJS?resolve(window.ExcelJS):reject(new Error('ExcelJS لم يتم تحميله'));
  s.onerror=()=>reject(new Error('تعذر تحميل مكتبة Excel'));
  document.head.appendChild(s);
 });
 return window.__hh149ExcelPromise;
}
function fileSafe(v){return String(v??'').replace(/[\\/:*?"<>|]+/g,'-').trim()}
function todayStamp(){
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function stayDetail(tr){
 const cells=tr.cells||[];
 const m=rowMeta(tr);
 return {
  name:m.name,
  rider:m.rider,
  unit:m.unit,
  checkIn:(cells[3]?.textContent||'').trim(),
  duration:(cells[4]?.textContent||'').trim()
 };
}
async function exportHousingDashboard(btn){
 const panel=getPanel();if(!panel)return;
 const rows=[...(panel.querySelector('.hh132-table tbody')?.rows||[])];
 if(!rows.length)return toast('لا يوجد ساكنون حاليًا للتصدير',true);
 const old=btn.textContent;btn.disabled=true;btn.textContent='جاري تجهيز Excel…';
 try{
  const ExcelJS=await ensureExcelJS();
  let unitsData=[];
  try{
   const z=(typeof zones!=='undefined'?zones:[]).find(x=>x.code==='HURGHADA'||x.name_ar==='الغردقة'||String(x.name_en||'').toLowerCase()==='hurghada');
   if(z)unitsData=await window.api('housing_units?select=id,name,capacity,status&zone_id=eq.'+z.id+'&status=eq.ACTIVE&order=name.asc');
  }catch(e){console.warn('housing export units',e)}
  const details=rows.map(stayDetail);
  const countMap=new Map();
  details.forEach(x=>countMap.set(x.unit,(countMap.get(x.unit)||0)+1));
  const unitNames=new Set([...countMap.keys(),...(unitsData||[]).map(u=>u.name)]);
  const units=[...unitNames].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));
  const capMap=new Map((unitsData||[]).map(u=>[u.name,Number(u.capacity||0)]));
  const summary=units.map(name=>{
    const occupied=countMap.get(name)||0,capacity=capMap.get(name)||occupied,available=Math.max(0,capacity-occupied);
    return {name,capacity,occupied,available,rate:capacity?occupied/capacity:0};
  });
  const totalCapacity=summary.reduce((s,x)=>s+x.capacity,0);
  const totalOccupied=summary.reduce((s,x)=>s+x.occupied,0);
  const totalAvailable=Math.max(0,totalCapacity-totalOccupied);
  const occupancy=totalCapacity?totalOccupied/totalCapacity:0;

  const wb=new ExcelJS.Workbook();
  wb.creator='007 Operations Hub';
  wb.company='Zero Zero Seven';
  wb.created=new Date();

  const dash=wb.addWorksheet('Dashboard',{views:[{rightToLeft:false,showGridLines:false}]});
  dash.properties.defaultRowHeight=20;
  dash.columns=[
   {key:'a',width:4},{key:'b',width:26},{key:'c',width:14},{key:'d',width:14},{key:'e',width:14},{key:'f',width:16},{key:'g',width:4}
  ];
  dash.mergeCells('B2:F3');
  const title=dash.getCell('B2');title.value='007 OPERATIONS — HOUSING DASHBOARD';
  title.font={name:'Arial',size:20,bold:true,color:{argb:'FFF1CF79'}};
  title.alignment={horizontal:'center',vertical:'middle'};
  title.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B1B2D'}};
  dash.getCell('B4').value='تاريخ التقرير';
  dash.getCell('C4').value=new Date();
  dash.getCell('C4').numFmt='dd/mm/yyyy';
  dash.getCell('E4').value='سكن الغردقة';
  ['B4','C4','E4'].forEach(a=>{const x=dash.getCell(a);x.font={bold:true,color:{argb:'FF566B83'}};x.alignment={horizontal:'center'}});

  const kpis=[
   ['B6','إجمالي الشقق',summary.length],
   ['C6','إجمالي الساكنين',totalOccupied],
   ['D6','السعة الإجمالية',totalCapacity],
   ['E6','الأماكن المتاحة',totalAvailable],
   ['F6','نسبة الإشغال',occupancy]
  ];
  kpis.forEach(([addr,label,val],idx)=>{
    const cell=dash.getCell(addr);cell.value=label;cell.font={bold:true,color:{argb:'FF9FB1C5'}};cell.alignment={horizontal:'center'};
    const valueCell=dash.getCell(addr.replace('6','7'));valueCell.value=val;
    valueCell.font={bold:true,size:18,color:{argb:idx===4?'FFF1CF79':'FFFFFFFF'}};
    valueCell.alignment={horizontal:'center'};
    valueCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF10263E'}};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF10263E'}};
    if(idx===4)valueCell.numFmt='0%';
  });

  const start=10;
  const headers=['الشقة','السعة','الموجود','المتاح','نسبة الإشغال'];
  dash.getRow(start).values=['',...headers];
  dash.getRow(start).height=26;
  for(let col=2;col<=6;col++){
   const h=dash.getCell(start,col);h.font={bold:true,color:{argb:'FF07111F'}};h.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE0B958'}};h.alignment={horizontal:'center'};
  }
  summary.forEach((u,i)=>{
   const r=start+1+i;
   dash.getCell(r,2).value=u.name;
   dash.getCell(r,3).value=u.capacity;
   dash.getCell(r,4).value=u.occupied;
   dash.getCell(r,5).value=u.available;
   dash.getCell(r,6).value=u.rate;
   dash.getCell(r,6).numFmt='0%';
   for(let col=2;col<=6;col++){
    const cell=dash.getCell(r,col);
    cell.alignment={horizontal:col===2?'right':'center',vertical:'middle'};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:i%2===0?'FFF6F8FB':'FFEEF2F6'}};
    cell.border={bottom:{style:'thin',color:{argb:'FFD7DEE8'}}};
   }
  });
  dash.autoFilter={from:{row:start,column:2},to:{row:start+summary.length,column:6}};
  dash.views=[{rightToLeft:false,showGridLines:false,state:'frozen',ySplit:10}];

  const residents=wb.addWorksheet('Residents',{views:[{rightToLeft:false,showGridLines:false,state:'frozen',ySplit:1}]});
  residents.columns=[
   {header:'الشقة',key:'unit',width:25},
   {header:'اسم المندوب',key:'name',width:42},
   {header:'Rider ID',key:'rider',width:16},
   {header:'تاريخ الدخول',key:'checkIn',width:16},
   {header:'مدة الإقامة',key:'duration',width:18}
  ];
  const sorted=details.slice().sort((a,b)=>a.unit.localeCompare(b.unit,'ar')||a.name.localeCompare(b.name,'ar'));
  sorted.forEach(x=>residents.addRow(x));
  residents.getRow(1).height=28;
  residents.getRow(1).eachCell(cell=>{
   cell.font={bold:true,color:{argb:'FF07111F'}};
   cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE0B958'}};
   cell.alignment={horizontal:'center',vertical:'middle'};
  });
  residents.eachRow((row,rowNumber)=>{
   if(rowNumber>1){
    row.eachCell(cell=>{
     cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:rowNumber%2===0?'FFF8FAFC':'FFF0F4F8'}};
     cell.border={bottom:{style:'thin',color:{argb:'FFE1E7EF'}}};
     cell.alignment={vertical:'middle'};
    });
   }
  });
  residents.autoFilter='A1:E'+(sorted.length+1);

  // Report layout only: keep apartment permissions, residents and portal actions unchanged.
  residents.getColumn(3).numFmt='@';
  residents.eachRow((row,rowNumber)=>{
   if(rowNumber>1){
    row.height=36;
    row.getCell(2).alignment={horizontal:'left',vertical:'middle',wrapText:true};
    row.getCell(3).value=String(row.getCell(3).value??'');
    row.getCell(3).alignment={horizontal:'center',vertical:'middle',readingOrder:'ltr'};
   }
  });

  // Names and IDs appear below EACH apartment on the Dashboard itself.
  const byApartment=new Map(summary.map(u=>[u.name,[]]));
  sorted.forEach(person=>byApartment.get(person.unit)?.push(person));
  let detailRow=start+summary.length+4;
  dash.mergeCells(`B${detailRow}:F${detailRow}`);
  const sectionTitle=dash.getCell(detailRow,2);
  sectionTitle.value='السكان حسب الشقة — الأسماء و Rider ID';
  sectionTitle.font={name:'Arial',size:15,bold:true,color:{argb:'FF0B1B2D'}};
  sectionTitle.alignment={horizontal:'left',vertical:'middle'};
  dash.getRow(detailRow).height=30;
  detailRow+=2;

  summary.forEach((unit,unitIndex)=>{
   const people=byApartment.get(unit.name)||[];
   const headingRow=detailRow;
   dash.mergeCells(`B${detailRow}:F${detailRow}`);
   const heading=dash.getCell(detailRow,2);
   heading.value=unit.name+' — '+people.length+' ساكن';
   heading.font={name:'Arial',size:13,bold:true,color:{argb:'FFF1CF79'}};
   heading.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B1B2D'}};
   heading.alignment={horizontal:'left',vertical:'middle',wrapText:true};
   dash.getRow(detailRow).height=30;
   // Clicking the apartment in the summary jumps directly to its residents.
   dash.getCell(start+1+unitIndex,2).value={text:unit.name,hyperlink:`#'Dashboard'!B${headingRow}`,tooltip:'عرض أسماء السكان والـ IDs'};
   detailRow++;
   dash.mergeCells(`C${detailRow}:F${detailRow}`);
   dash.getCell(detailRow,2).value='Rider ID';
   dash.getCell(detailRow,3).value='اسم المندوب';
   [2,3].forEach(col=>{
    const cell=dash.getCell(detailRow,col);
    cell.font={name:'Arial',size:11,bold:true,color:{argb:'FF07111F'}};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE0B958'}};
    cell.alignment={horizontal:col===2?'center':'left',vertical:'middle'};
   });
   dash.getRow(detailRow).height=24;
   detailRow++;
   if(!people.length){
    dash.mergeCells(`B${detailRow}:F${detailRow}`);
    const empty=dash.getCell(detailRow,2);
    empty.value='لا يوجد ساكنون حاليًا';
    empty.font={name:'Arial',size:11,italic:true,color:{argb:'FF566B83'}};
    empty.alignment={horizontal:'left',vertical:'middle'};
    dash.getRow(detailRow).height=26;
    detailRow++;
   }
   people.forEach((person,personIndex)=>{
    dash.mergeCells(`C${detailRow}:F${detailRow}`);
    const idCell=dash.getCell(detailRow,2),nameCell=dash.getCell(detailRow,3);
    idCell.value=String(person.rider);
    idCell.numFmt='@';
    nameCell.value=String(person.name);
    [idCell,nameCell].forEach(cell=>{
     cell.font={name:'Arial',size:11,color:{argb:'FF172B43'}};
     cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:personIndex%2===0?'FFF6F8FB':'FFEEF2F6'}};
     cell.border={bottom:{style:'thin',color:{argb:'FFD7DEE8'}}};
    });
    idCell.alignment={horizontal:'center',vertical:'middle',readingOrder:'ltr'};
    nameCell.alignment={horizontal:'left',vertical:'middle',wrapText:true};
    dash.getRow(detailRow).height=String(person.name).length>75?42:30;
    detailRow++;
   });
   detailRow+=2;
  });
  dash.mergeCells(`B${detailRow}:F${detailRow}`);
  const source=dash.getCell(detailRow,2);
  source.value='Source: https://007-operations-portal.vercel.app/portal';
  source.font={name:'Arial',size:9,color:{argb:'FF566B83'}};
  source.alignment={horizontal:'left',vertical:'middle'};


  const buffer=await wb.xlsx.writeBuffer();
  const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='007-Housing-Dashboard-LTR-'+todayStamp()+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1200);
  toast('تم تنزيل ملخص السكن Excel ✅');
 }catch(e){console.error('housing dashboard export',e);toast(e.message||'تعذر تجهيز ملف Excel',true)}
 finally{btn.disabled=false;btn.textContent=old}
}

function decorate(){
 if(busy)return;busy=true;
 try{
  const panel=getPanel();if(!panel)return;
  const table=panel.querySelector('.hh132-table');if(!table)return;
  const rows=[...(table.tBodies?.[0]?.rows||[])];
  const counts=new Map();rows.forEach(tr=>{const u=rowMeta(tr).unit;if(u)counts.set(u,(counts.get(u)||0)+1)});
  const units=[...counts.keys()].sort((a,b)=>a.localeCompare(b,'ar'));
  if(selectedUnit!=='ALL'&&!counts.has(selectedUnit))selectedUnit='ALL';
  let bar=panel.querySelector('.hh149-filter');
  if(!bar){
   bar=document.createElement('div');bar.className='hh149-filter';
   panel.querySelector('.panel-head')?.insertAdjacentElement('afterend',bar);
  }
  bar.innerHTML='<div class="hh149-top"><label class="hh149-search"><span>⌕</span><input data-hh149-search type="search" placeholder="بحث بالاسم أو Rider ID أو اسم الشقة"></label><button class="hh149-clear" data-hh149-clear>مسح الفلتر</button><button class="hh149-export" data-hh149-export>⬇ تنزيل ملخص السكن Excel</button></div><div class="hh149-units" data-hh149-units></div><div class="hh149-foot"><span data-hh149-summary></span><span>اضغط على اسم الشقة لعرض سكانها فقط</span></div>';
  const input=bar.querySelector('[data-hh149-search]');input.value=searchTerm;
  input.addEventListener('input',()=>{searchTerm=input.value;applyFilter()});
  bar.querySelector('[data-hh149-clear]').onclick=()=>{selectedUnit='ALL';searchTerm='';input.value='';applyFilter()};
  bar.querySelector('[data-hh149-export]').onclick=e=>exportHousingDashboard(e.currentTarget);
  const strip=bar.querySelector('[data-hh149-units]');
  const addChip=(name,label,count)=>{
   const b=document.createElement('button');b.type='button';b.className='hh149-unit';b.dataset.hh149Unit=name;
   const text=document.createElement('span');text.textContent=label;const badge=document.createElement('span');badge.className='hh149-count';badge.textContent=count;
   b.append(text,badge);b.onclick=()=>{selectedUnit=name;applyFilter()};strip.appendChild(b);
  };
  addChip('ALL','الكل',rows.length);
  units.forEach(u=>addChip(u,u,counts.get(u)||0));
  applyFilter();
 }finally{busy=false}
}
document.addEventListener('click',e=>{const t=e.target instanceof Element?e.target.closest('[data-hht="stays"]'):null;if(t)setTimeout(decorate,140)},true);
const prevRefresh=window.refreshAll;
if(typeof prevRefresh==='function')window.refreshAll=async function(){const r=await prevRefresh.apply(this,arguments);setTimeout(decorate,160);return r};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(decorate,300),{once:true});else setTimeout(decorate,300);
})();
</script>
