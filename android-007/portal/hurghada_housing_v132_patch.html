<script id="hh132Script" data-version="1.3.2b">
(function(){
let Z=null,A=false,ADM=false,MANAGE_UNITS=false,U=[],R=[],S=[],P=null,AS=[],EV=[],TAB='overview';
const prevRefresh=window.refreshAll,prevGo=window.go;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const admin=()=>!!me&&(['OWNER','ADMIN','REVIEWER'].includes(me.role)||me.can_see_internal===true);
const unit=id=>U.find(x=>x.id===id);
const stay=id=>S.find(x=>x.id===id);
const assessmentsFor=stayId=>AS.filter(x=>x.stay_id===stayId);
const evidenceFor=assessmentId=>EV.filter(x=>x.assessment_id===assessmentId);
const request=id=>R.find(x=>x.id===id);
const money=v=>Number(v||0).toFixed(2)+' ج';
const num=v=>Number(v||0);
function sec(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id))}
function head(a,b){const t=document.getElementById('pageTitle'),p=document.getElementById('pageSub');if(t)t.textContent=a;if(p)p.textContent=b}
function reqLabel(s){return ({PENDING:'قيد المراجعة',APPROVED:'تم الاعتماد',REJECTED:'مرفوض',CANCELLED:'ملغي'}[s]||s)}
function dedLabel(s){return ({AWAITING_HOURS:'بانتظار الإثبات والساعات',NOT_REQUIRED:'مجاني',PENDING:'خصم مطلوب',RAISED:'تم رفع الخصم',WAIVED:'إعفاء'}[s]||s)}
function dedClass(s){return s==='NOT_REQUIRED'?'ok':s==='PENDING'?'bad':s==='RAISED'?'blue':s==='WAIVED'?'ok':'pending'}
function reqClass(s){return s==='APPROVED'?'ok':s==='REJECTED'?'bad':s==='PENDING'?'pending':''}
function extFor(file){const n=(file.name||'').toLowerCase();if(n.includes('.'))return n.split('.').pop().replace(/[^a-z0-9]/g,'').slice(0,8)||'bin';const m=(file.type||'').split('/').pop();return (m||'bin').replace(/[^a-z0-9]/g,'').slice(0,8)}
async function access(){Z=(zones||[]).find(x=>x.code==='HURGHADA'||x.name_ar==='الغردقة'||String(x.name_en||'').toLowerCase()==='hurghada');ADM=admin();MANAGE_UNITS=ADM||me?.role==='ZONE_MANAGER';if(!me||!Z){A=false;return}if(ADM){A=true;return}try{const r=await api(`user_zones?select=zone_id&user_id=eq.${me.id}&zone_id=eq.${Z.id}`);A=Array.isArray(r)&&r.length>0}catch(e){A=false}}
async function generatePeriods(){if(!A||!S.length)return;await Promise.all(S.filter(x=>['ACTIVE','ENDED'].includes(x.status)).map(x=>api('rpc/housing_generate_assessments_for_stay',{method:'POST',body:JSON.stringify({p_stay_id:x.id,p_as_of:today()})}).catch(()=>null)))}
async function load(){await access();if(!A){U=[];R=[];S=[];AS=[];EV=[];P=null;return}let r=await Promise.all([
 api(`housing_units?select=*&zone_id=eq.${Z.id}&order=name.asc`),
 api(`housing_requests?select=*&zone_id=eq.${Z.id}&order=created_at.desc`),
 api(`housing_stays?select=*&zone_id=eq.${Z.id}&order=check_in_date.desc`),
 api(`housing_policies?select=*&zone_id=eq.${Z.id}&active=eq.true&order=effective_from.desc&limit=1`)
]);U=r[0]||[];R=r[1]||[];S=r[2]||[];P=(r[3]||[])[0]||null;await generatePeriods();AS=await api(`housing_assessments?select=*&zone_id=eq.${Z.id}&order=period_end.desc,period_start.desc`);try{EV=AS.length?await api('housing_evidence?select=*&order=uploaded_at.desc'):[]}catch(e){console.warn('housing evidence unavailable',e);EV=[]}}
function killOld(){['housingResidentModal','housingPaymentModal','housingUnitModal','sec-housing','h130RequestModal','h130UnitModal','h130HoursModal','sec-housing130','hh131Modal','sec-hh131'].forEach(id=>document.getElementById(id)?.remove())}
function ensure(){killOld();const m=document.querySelector('.main');if(m&&!document.getElementById('sec-hh132'))m.insertAdjacentHTML('beforeend','<section id="sec-hh132" class="section"><div id="hh132Body"></div></section>');if(!document.getElementById('hh132ReqModal'))document.body.insertAdjacentHTML('beforeend',`
<div id="hh132ReqModal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="hh132ReqTitle">طلب دخول سكن</h3><button class="close" data-hh132-close="hh132ReqModal">×</button></div><input id="hh132ReqType" type="hidden"><input id="hh132ReqStay" type="hidden"><div class="hh132-form-grid"><div class="field"><label>Rider ID</label><input id="hh132ReqRider" class="input"></div><div class="field"><label>اسم الطيار</label><input id="hh132ReqName" class="input"></div><div class="field"><label>التاريخ الفعلي</label><input id="hh132ReqDate" class="input" type="date"></div><div class="field" id="hh132ReqUnitField"><label>الشقة</label><select id="hh132ReqUnit" class="input"></select></div></div><div class="field"><label>ملاحظات</label><textarea id="hh132ReqNote" class="input" rows="3"></textarea></div><button id="hh132ReqSave" class="btn btn-primary wide">إرسال الطلب</button></div></div>
<div id="hh132ProofModal" class="modal"><div class="modal-card"><div class="modal-head"><h3>رفع إثبات الساعات</h3><button class="close" data-hh132-close="hh132ProofModal">×</button></div><input id="hh132ProofAssessment32ReqType" type="hiddid="hh132ProofPeriod" class="hh132-evidence-required"></div><div class="hh132-upload-box"><div class="field"><label>صورة/صور أو PDF للإثبات</label><input id="hh132ProofFiles" class="input" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf"></div><div class="field"><label>ملاحظات على الإثبات</label><textarea id="hh132ProofNote" class="input" rows="2"></textarea></div><small class="muted">حد أقصى 4 ملفات، 8 MB لكل ملف.</small></div><button id="hh132ProofSave" class="btn btn-primary wide">رفع الإثبات</button></div></div>
<div id="hh132HoursModal" class="modal"><div class="modal-card"><div class="modal-head"><h3>اعتماد الساعات الفعلية</h3><button class="close" data-hh132-close="hh132HoursModal">×</button></div><input id="hh132HoursAssessment32ReqType" type="hiddid="hh132HoursInfo" class="hh132-evidence-required"></div><div class="field"><label>الساعات الفعلية المحققة</label><input id="hh132HoursValue" class="input" type="number" min="0" step="0.01"></div><button id="hh132HoursSave" class="btn btn-primary wide">اعتماد الساعات وحساب النتيجة</button></div></div>
<div id="hh132UnitModal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="hh132UnitTitle">إضافة شقة</h3><button class="close" data-hh132-close="hh132UnitModal">×</button></div><input id="hh132UnitId" type="hidden"><div class="hh132-form-grid"><div class="field"><label>اسم الشقة</label><input id="hh132UnitName" class="input"></div><div class="field"><label>الكود</label><input id="hh132UnitCode" class="input"></div><div class="field"><label>السعة</label><input id="hh132UnitCapacity" class="input" type="number" min="1" value="1"></div><div class="field"><label>الإيجار الشهري</label><input id="hh132UnitRent32class="input" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>اسم المالك</label><input id="hh132Landlord" class="input"></div><div class="field"><label>تليفون المالك</label><input id="hh132LandlordPhone" class="input"></div><div class="field" style="grid-column:1/-1"><label>العنوان</label><input id="hh132UnitAddress" class="input"></div></div><button id="hh132UnitSave" class="btn btn-primary wide">حفظ الشقة</button></div></div>
<div id="hh132PolicyModal" class="modal"><div class="modal-card"><div class="modal-head"><h3>إعدادات حساب السكن</h3><button class="close" data-hh132-close="hh132PolicyModal">×</button></div><div class="hh132-form-grid"><div class="field"><label>أيام الدورة القياسية</label><input id="hh132CycleDays" class="input" type="number" min="1"></div><div class="field"><label>تارجت الدورة</label><input id="hh132TargetHours" class="input" type="number" min="0" step="0.01"></div><div class="field"><label>قيمة السكن</label><input id="hh132HousingFee" class="input" type="number" min="0" step="0.01"></div></div><div class="hh132-note">التقسيم شهري: كل شهر من يوم 1 إلى يوم 30. يوم 31 لا يدخل في حساب السكن. فبراير ينتهي عند آخر يوم فعلي في الشهر.</div><button id="hh132PolicySave" class="btn btn-primary wide">حفظ الإعدادات</button></div></div>`);document.querySelectorAll('[data-hh132-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.hh132Close)?.classList.remove('open'));document.getElementById('hh132ReqSave').onclick=saveRequest;document.getElementById('hh132ProofSave').onclick=saveProof;document.getElementById('hh132HoursSave').onclick=saveHours;document.getElementById('hh132UnitSave').onclick=saveUnit;document.getElementById('hh132PolicySave').onclick=savePolicy}
function nav(){const d=document.getElementById('desktopNav');if(d){let b=d.querySelector('[data-go="housing"]');if(!A)b?.remove();else{if(!b){b=document.createElement('button');b.dataset.go='housing';d.appendChild(b)}b.innerHTML='<span>⌂</span>سكن الغردقة';b.onclick=show}}const m=document.getElementById('mobileNav');if(m){let b=m.querySelector('[data-go="housing"]');if(!A)b?.remove();else{if(!b){b=document.createElement('button');b.dataset.go='housing';m.appendChild(b)}b.innerHTML='<span>⌂</span>السكن';b.onclick=show}}}
function tabs(){let x=[['overview','نظرة عامة'],['requests','طلبات الدخول والخروج'],['stays','الساكنين حاليًا'],['proofs','إثبات الساعات'],['exited','خرجوا من السكن'],['units','الشقق']];if(ADM)x.push(['assess','الحساب والخصومات'],['settings','الإعدادات']);return `<div class="hh132-tabs">${x.map(a=>`<button class="${TAB===a[0]?'active':''}" data-hht="${a[0]}">${a[1]}</button>`).join('')}</div>`}
function policyHtml(){return P?`<div class="hh132-policy"><div><small>قاعدة الشهر</small><b>1 → 30</b></div><div><small>التارجت الكامل</small><b>${num(P.full_target_hours).toFixed(2)} ساعة</b></div><div><small>قيمة السكن</small><b>${money(P.full_housing_fee)}</b></div></div>`:''}
function overview(){const active=S.filter(x=>x.status==='ACTIVE'),ended=S.filter(x=>x.status==='ENDED'),cap=U.filter(x=>x.status==='ACTIVE').reduce((a,x)=>a+num(x.capacity),0),pend=R.filter(x=>x.status==='PENDING').length,awaitProof=AS.filter(x=>x.actual_hours==null).length;return `${policyHtml()}<div class="hh132-kpis"><div class="hh132-kpi"><small>الشقق</small><b>${U.length}</b></div><div class="hh132-kpi"><small>ساكن حاليًا</small><b>${active.length}</b></div><div class="hh132-kpi"><small>خرجوا من السكن</small><b>${ended.length}</b></div><div class="hh132-kpi"><small>طلبات معلقة</small><b>${pend}</b></div><div class="hh132-kpi"><small>فترات تنتظر ساعات</small><b>${awaitProof}</b></div></div><div class="hh132-note"><strong>النظام الموحد:</strong> الإقامة مستمرة، لكن الحساب يتقفل كل شهر عند يوم 30. مثال: دخول 17/08 يبقى أول حساب 17/08 → 30/08، ولو استمر يبدأ حساب جديد 01/09 → 30/09. الخروج يقفل آخر فترة فورًا.</div>`}
function requests(){return `<div class="panel"><div class="panel-head"><h3>طلبات الدخول والخروج</h3><button class="btn btn-secondary" data-in>+ طلب دخول</button></div>${R.length?R.map(r=>`<div class="hh132-card"><div class="hh132-row"><b>${r.request_type==='CHECK_IN'?'طلب دخول':'طلب خروج'} — ${esc(r.rider_name)}</b><span class="hh132-badge ${reqClass(r.status)}">${reqLabel(r.status)}</span></div><div class="hh132-row"><span>Rider ID: ${esc(r.rider_id)}</span><span>التاريخ: ${esc(r.effective_date)}</span></div>${r.request_type==='CHECK_IN'?`<div>الشقة: ${esc(unit(r.unit_id)?.name||'—')}</div>`:''}${r.supervisor_note?`<small class="muted">ملاحظات: ${esc(r.supervisor_note)}</small>`:''}${ADM&&r.status==='PENDING'?`<div class="hh132-actions"><button class="hh132-btn gold" data-ok="${r.id}">اعتماد</button><button class="hh132-btn bad" data-no="${r.id}">رفض</button></div>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات</div>'}</div>`}
function stays(){const rows=S.filter(x=>x.status==='ACTIVE');return `<div class="panel"><div class="panel-head"><h3>الساكنين حاليًا</h3></div>${rows.length?`<div class="hh132-wrap"><table class="hh132-table"><thead><tr><th>الطيار</th><th>Rider ID</th><th>الشقة</th><th>تاريخ الدخول</th><th>مدة الإقامة</th><th></th></tr></thead><tbody>${rows.map(s=>{const days=Math.max(1,Math.floor((new Date(today())-new Date(s.check_in_date))/86400000)+1);return `<tr><td>${esc(s.rider_name)}</td><td>${esc(s.rider_id)}</td><td>${esc(unit(s.unit_id)?.name||'—')}</td><td>${esc(s.check_in_date)}</td><td>${days} يوم تقويمي</td><td><button class="hh132-btn gold" data-out="${s.id}">طلب خروج</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا يوجد ساكنون حاليًا</div>'}</div>`}
function proofButtons(a){const e=evidenceFor(a.id);return e.length?`<div class="hh132-proof-list">${e.map((x,i)=>`<button class="hh132-proof" data-open-proof="${esc(x.storage_path)}">إثبات ${i+1}</button>`).join('')}</div>`:'<span class="muted">لا يوجد إثبات</span>'}
function proofs(){const rows=AS;return `<div class="panel"><div class="panel-head"><h3>إثبات الساعات حسب فترة الحساب</h3></div><div class="hh132-note">كل إثبات مربوط بفترة شهرية محددة. المشرف يرفع الإثبات، والإدارة تعتمد الساعات الفعلية وتظهر النتيجة تلقائيًا.</div>${rows.length?`<div class="hh132-wrap"><table class="hh132-table"><thead><tr><th>الطيار</th><th>الفترة</th><th>الأيام</th><th>التارجت</th><th>الإثبات</th><th>الساعات المعتمدة</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(a=>{const s=stay(a.stay_id),ev=evidenceFor(a.id);return `<tr><td>${esc(s?.rider_name||'—')}<br><small>${esc(s?.rider_id||'')}</small></td><td>${a.period_start} → ${a.period_end}</td><td>${a.days_count}</td><td>${a.target_hours} س</td><td>${proofButtons(a)}</td><td>${a.actual_hours==null?'—':a.actual_hours+' س'}</td><td><span class="hh132-badge ${dedClass(a.deduction_status)}">${dedLabel(a.deduction_status)}</span></td><td><div class="hh132-actions"><button class="hh132-btn blue" data-proof="${a.id}">${ev.length?'إضافة إثبات':'رفع إثبات'}</button>${ADM?`<button class="hh132-btn gold" data-hours="${a.id}">${a.actual_hours==null?'اعتماد الساعات':'تعديل الساعات'}</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد فترات حساب مستحقة حتى الآن</div>'}</div>`}
function exited(){const rows=S.filter(x=>x.status==='ENDED');return `<div class="panel hh132-archive"><div class="panel-head"><h3>خرجوا من السكن — الأرشيف الكامل</h3></div>${rows.length?rows.map(s=>{const aa=assessmentsFor(s.id),proofCount=aa.reduce((n,a)=>n+evidenceFor(a.id).length,0),days=aa.reduce((n,a)=>n+num(a.days_count),0),target=aa.reduce((n,a)=>n+num(a.target_hours),0),actualKnown=aa.filter(a=>a.actual_hours!=null),actual=actualKnown.reduce((n,a)=>n+num(a.actual_hours),0),ded=aa.reduce((n,a)=>n+num(a.deduction_amount),0),inReq=request(s.check_in_request_id),outReq=request(s.check_out_request_id);return `<details><summary><div class="hh132-row"><b>${esc(s.rider_name)} — ${esc(s.rider_id)}</b><span class="hh132-badge ok">خرج ${esc(s.check_out_date)}</span></div><div class="hh132-summary-grid"><div><small>الشقة</small><b>${esc(unit(s.unit_id)?.name||'—')}</b></div><div><small>الإقامة</small><b>${esc(s.check_in_date)} → ${esc(s.check_out_date)}</b></div><div><small>الأيام المحسوبة</small><b>${days}</b></div><div><small>الإثباتات</small><b>${proofCount}</b></div></div></summary><div class="hh132-archive-body"><div class="hh132-row"><span>إجمالي التارجت: <b>${target.toFixed(2)} ساعة</b></span><span>الساعات المعتمدة: <b>${actualKnown.length===aa.length?actual.toFixed(2):'يوجد فترات ناقصة'}</b></span>${ADM?`<span>إجمالي الخصم: <b class="${ded>0?'hh132-total-deduction':'hh132-free'}">${money(ded)}</b></span>`:''}</div>${inReq?.supervisor_note?`<div class="hh132-note">ملاحظة الدخول: ${esc(inReq.supervisor_note)}</div>`:''}${outReq?.supervisor_note?`<div class="hh132-note">ملاحظة الخروج: ${esc(outReq.supervisor_note)}</div>`:''}${aa.length?`<div class="hh132-wrap"><table class="hh132-table"><thead><tr><th>الفترة</th><th>الأيام</th><th>التارجت</th><th>المحقق</th><th>الإثباتات</th>${ADM?'<th>قيمة الفترة</th><th>الخصم</th>':''}</tr></thead><tbody>${aa.map(a=>`<tr><td>${a.period_start} → ${a.period_end}</td><td>${a.days_count}</td><td>${a.target_hours}</td><td>${a.actual_hours==null?'—':a.actual_hours}</td><td>${proofButtons(a)}</td>${ADM?`<td>${money(a.prorated_housing_fee)}</td><td>${money(a.deduction_amount)}<br><small>${dedLabel(a.deduction_status)}</small></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد فترات حساب</div>'}</div></details>`}).join(''):'<div class="empty">لا يوجد طيارون خرجوا من السكن حتى الآن</div>'}</div>`}
function units(){const occupied=id=>S.filter(s=>s.unit_id===id&&s.status==='ACTIVE').length;return `<div class="panel"><div class="panel-head"><h3>شقق الغردقة</h3>${MANAGE_UNITS?'<button class="btn btn-secondary" data-add-unit>+ إضافة شقة</button>':''}</div>${U.length?`<div class="hh132-unit-grid">${U.map(u=>`<div class="hh132-unit"><div class="hh132-row"><b>${esc(u.name)}</b><span class="hh132-badge ${u.status==='ACTIVE'?'ok':''}">${esc(u.status)}</span></div><small>${esc(u.address||'بدون عنوان')}</small><div class="hh132-summary-grid"><div><small>السعة</small><b>${u.capacity}</b></div><div><small>الموجود</small><b>${occupied(u.id)}</b></div><div><small>المتاح</small><b>${Math.max(0,num(u.capacity)-occupied(u.id))}</b></div><div><small>الإيجار</small><b>${money(u.monthly_rent)}</b></div></div>${MANAGE_UNITS?`<div class="hh132-actions"><button class="hh132-btn gold" data-edit-unit="${u.id}">تعديل</button></div>`:''}</div>`).join('')}</div>`:'<div class="empty">لا توجد شقق مسجلة</div>'}</div>`}
function assess(){if(!ADM)return '';return `<div class="panel"><div class="panel-head"><h3>الحساب والخصومات</h3></div>${AS.length?`<div class="hh132-wrap"><table class="hh132-table"><thead><tr><th>الطيار</th><th>الفترة</th><th>الأيام</th><th>التارجت</th><th>المحقق</th><th>قيمة الفترة</th><th>الخصم</th><th>الحالة</th><th>التفاصيل</th></tr></thead><tbody>${AS.map(a=>{const s=stay(a.stay_id);return `<tr><td>${esc(s?.rider_name||'—')}<br><small>${esc(s?.rider_id||'')}</small></td><td>${a.period_start} → ${a.period_end}</td><td>${a.days_count}</td><td>${a.target_hours}</td><td>${a.actual_hours==null?'—':a.actual_hours}</td><td>${money(a.prorated_housing_fee)}</td><td>${money(a.deduction_amount)}</td><td><span class="hh132-badge ${dedClass(a.deduction_status)}">${dedLabel(a.deduction_status)}</span></td><td><small>${esc(a.deduction_details||'—')}</small></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد حسابات</div>'}</div>`}
function settings(){if(!ADM)return '';return `${policyHtml()}<div class="panel"><div class="panel-head"><h3>إعدادات سياسة السكن</h3><button class="btn btn-secondary" data-edit-policy>تعديل</button></div><div class="hh132-note"><strong>ثابت النظام الحالي:</strong> كل شهر يعاد الحساب من يوم 1، ويُقفل عند يوم 30. يوم 31 لا يدخل ضمن عدد أيام السكن أو التارجت.</div></div>`}
function render(){if(!A)return;const b=document.getElementById('hh132Body');if(!b)return;b.innerHTML=tabs()+(TAB==='overview'?overview():TAB==='requests'?requests():TAB==='stays'?stays():TAB==='proofs'?proofs():TAB==='exited'?exited():TAB==='units'?units():TAB==='assess'?assess():settings());document.querySelectorAll('[data-hht]').forEach(x=>x.onclick=()=>{TAB=x.dataset.hht;render()});document.querySelectorAll('[data-in]').forEach(x=>x.onclick=()=>openReq('CHECK_IN'));document.querySelectorAll('[data-out]').forEach(x=>x.onclick=()=>openReq('CHECK_OUT',x.dataset.out));document.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>approve(x.dataset.ok));document.querySelectorAll('[data-no]').forEach(x=>x.onclick=()=>reject(x.dataset.no));document.querySelectorAll('[data-proof]').forEach(x=>x.onclick=()=>openProofModal(x.dataset.proof));document.querySelectorAll('[data-hours]').forEach(x=>x.onclick=()=>openHours(x.dataset.hours));document.querySelectorAll('[data-open-proof]').forEach(x=>x.onclick=()=>openStoredProof(x.dataset.openProof));document.querySelectorAll('[data-add-unit]').forEach(x=>x.onclick=()=>openUnit());document.querySelectorAll('[data-edit-unit]').forEach(x=>x.onclick=()=>openUnit(x.dataset.editUnit));document.querySelectorAll('[data-edit-policy]').forEach(x=>x.onclick=openPolicy)}
function show(){if(!A)return toast('السكن متاح فقط للحسابات المرتبطة بزون الغردقة',true);sec('sec-hh132');head('سكن الغردقة','طلبات الدخول والخروج، الفترات الشهرية، إثبات الساعات والأرشيف');document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go==='housing'));render();window.scrollTo({top:0,behavior:'smooth'})}
function openReq(type,stayId=''){const s=stayId?stay(stayId):null;document.getElementById('hh132ReqType').value=type;document.getElementById('hh132ReqStay').value=stayId||'';document.getElementById('hh132ReqTitle').textContent=type==='CHECK_IN'?'طلب دخول سكن':'طلب خروج من السكن';document.getElementById('hh132ReqDate').value=today();document.getElementById('hh132ReqNote').value='';document.getElementById('hh132ReqUnit').innerHTML=U.filter(x=>x.status==='ACTIVE').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const rider=document.getElementById('hh132ReqRider'),name=document.getElementById('hh132ReqName');rider.readOnly=!!s;name.readOnly=!!s;rider.value=s?.rider_id||'';name.value=s?.rider_name||'';document.getElementById('hh132ReqUnitField').style.display=type==='CHECK_IN'?'block':'none';document.getElementById('hh132ReqModal').classList.add('open')}
async function saveRequest(){const t=document.getElementById('hh132ReqType').value,r=document.getElementById('hh132ReqRider').value.trim(),n=document.getElementById('hh132ReqName').value.trim(),d=document.getElementById('hh132ReqDate').value,u=document.getElementById('hh132ReqUnit').value||null,note=document.getElementById('hh132ReqNote').value.trim();if(!r||!n||!d)return toast('Rider ID واسم الطيار والتاريخ مطلوبين',true);if(t==='CHECK_IN'&&!u)return toast('اختار الشقة',true);try{await api('housing_requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({request_type:t,zone_id:Z.id,unit_id:t==='CHECK_IN'?u:null,rider_id:r,rider_name:n,effective_date:d,supervisor_note:note||null,requested_by:me.id})});document.getElementById('hh132ReqModal').classList.remove('open');toast('تم إرسال الطلب ✅');await refreshAll();TAB='requests';show()}catch(e){toast(e.message||'تعذر إرسال الطلب',true)}}
async function approve(id){if(!confirm('اعتماد الطلب وتنفيذ الدخول/الخروج؟'))return;try{await api('rpc/housing_approve_request',{method:'POST',body:JSON.stringify({p_request_id:id,p_review_note:null})});toast('تم اعتماد الطلب ✅');await refreshAll();TAB='requests';show()}catch(e){toast(e.message,true)}}
async function reject(id){const n=prompt('سبب الرفض:')||'';if(!n.trim())return;try{await api('rpc/housing_reject_request',{method:'POST',body:JSON.stringify({p_request_id:id,p_review_note:n.trim()})});toast('تم رفض الطلب');await refreshAll();TAB='requests';show()}catch(e){toast(e.message,true)}}
function openProofModal(id){const a=AS.find(x=>x.id===id),s=a?stay(a.stay_id):null;if(!a)return;document.getElementById('hh132ProofAssessment').value=id;document.getElementById('hh132ProofFiles').value='';document.getElementById('hh132ProofNote').value='';document.getElementById('hh132ProofPeriod').innerHTML=`<b>${esc(s?.rider_name||'')}</b> — ${a.period_start} → ${a.period_end}<br>التارجت: <b>${a.target_hours} ساعة</b> | عدد الأيام: <b>${a.days_count}</b>`;document.getElementById('hh132ProofModal').classList.add('open')}
async function storageUploadHousing(path,file,retry=true){let token=session?.access_token;if(!token)throw new Error('غير مسجل الدخول');let r=await fetch(SUPABASE_URL+'/storage/v1/object/housing-evidence/'+encodeURI(path),{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(r.status===401&&retry&&session?.refresh_token){await refreshToken();return storageUploadHousing(path,file,false)}return parseResponse(r)}
async function storageDeleteHousing(path){let token=session?.access_token;if(!token)return;await fetch(SUPABASE_URL+'/storage/v1/object/housing-evidence/'+encodeURI(path),{method:'DELETE',headers:{apikey:API_KEY,Authorization:'Bearer '+token}}).catch(()=>null)}
async function openStoredProof(path,retry=true){let token=session?.access_token;if(!token)throw new Error('غير مسجل الدخول');let r=await fetch(SUPABASE_URL+'/storage/v1/object/authenticated/housing-evidence/'+encodeURI(path),{headers:{apikey:API_KEY,Authorization:'Bearer '+token}});if(r.status===401&&retry&&session?.refresh_token){await refreshToken();return openStoredProof(path,false)}if(!r.ok)return toast('تعذر فتح الإثبات',true);const blob=await r.blob(),url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),120000)}
async function saveProof(){const id=document.getElementById('hh132ProofAssessment').value,a=AS.find(x=>x.id===id),files=[...document.getElementById('hh132ProofFiles').files],note=document.getElementById('hh132ProofNote').value.trim();if(!a)return;if(!files.length)return toast('اختار صورة إثبات أو PDF',true);if(files.length>4)return toast('الحد الأقصى 4 ملفات',true);if(files.some(f=>f.size>8*1024*1024))return toast('كل ملف لازم يكون أقل من 8 MB',true);const allowed=['image/jpeg','image/png','image/webp','image/heic','image/heif','application/pdf'];if(files.some(f=>!allowed.includes(f.type)))return toast('نوع ملف غير مدعوم',true);const saved=[];try{for(const f of files){const path=`${a.id}/${Date.now()}-${crypto.randomUUID()}.${extFor(f)}`;await storageUploadHousing(path,f);try{await api('housing_evidence',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({assessment_id:a.id,stay_id:a.stay_id,evidence_type:'HOURS_PROOF',storage_path:path,original_name:f.name,mime_type:f.type,size_bytes:f.size,note:note||null,uploaded_by:me.id})});saved.push(path)}catch(e){await storageDeleteHousing(path);throw e}}document.getElementById('hh132ProofModal').classList.remove('open');toast('تم رفع إثبات الساعات ✅');await refreshAll();TAB='proofs';show()}catch(e){toast(e.message||'تعذر رفع الإثبات',true)}}
function openHours(id){const a=AS.find(x=>x.id===id),s=a?stay(a.stay_id):null;if(!a)return;const ev=evidenceFor(id);document.getElementById('hh132HoursAssessment').value=id;document.getElementById('hh132HoursValue').value=a.actual_hours??'';document.getElementById('hh132HoursInfo').innerHTML=`<b>${esc(s?.rider_name||'')}</b> — ${a.period_start} → ${a.period_end}<br>التارجت: <b>${a.target_hours} ساعة</b> | الإثباتات المرفوعة: <b>${ev.length}</b>${!ev.length?'<br><span style="color:#ffb3bb">يفضل رفع إثبات قبل اعتماد الساعات.</span>':''}`;document.getElementById('hh132HoursModal').classList.add('open')}
async function saveHours(){const id=document.getElementById('hh132HoursAssessment').value,v=Number(document.getElementById('hh132HoursValue').value);if(!Number.isFinite(v)||v<0)return toast('اكتب عدد ساعات صحيح',true);try{await api('rpc/housing_set_actual_hours',{method:'POST',body:JSON.stringify({p_assessment_id:id,p_actual_hours:v,p_source:'HOURS_PROOF_REVIEW'})});document.getElementById('hh132HoursModal').classList.remove('open');toast('تم اعتماد الساعات وحساب النتيجة ✅');await refreshAll();TAB='proofs';show()}catch(e){toast(e.message,true)}}
function openUnit(id=''){if(!MANAGE_UNITS)return;const u=id?unit(id):null;document.getElementById('hh132UnitId').value=id||'';document.getElementById('hh132UnitTitle').textContent=u?'تعديل الشقة':'إضافة شقة';document.getElementById('hh132UnitName').value=u?.name||'';document.getElementById('hh132UnitCode').value=u?.code||'';document.getElementById('hh132UnitCapacity').value=u?.capacity||1;document.getElementById('hh132UnitRent').value=u?.monthly_rent||0;document.getElementById('hh132Landlord').value=u?.landlord_name||'';document.getElementById('hh132LandlordPhone').value=u?.landlord_phone||'';document.getElementById('hh132UnitAddress').value=u?.address||'';document.getElementById('hh132UnitModal').classList.add('open')}
async function saveUnit(){if(!MANAGE_UNITS)return;const id=document.getElementById('hh132UnitId').value,name=document.getElementById('hh132UnitName').value.trim(),code=document.getElementById('hh132UnitCode').value.trim(),capacity=Number(document.getElementById('hh132UnitCapacity').value||1),monthly_rent=Number(document.getElementById('hh132UnitRent').value||0),landlord_name=document.getElementById('hh132Landlord').value.trim(),landlord_phone=document.getElementById('hh132LandlordPhone').value.trim(),address=document.getElementById('hh132UnitAddress').value.trim();if(!name)return toast('اكتب اسم الشقة',true);const body={zone_id:Z.id,name,code:code||null,capacity,monthly_rent,landlord_name:landlord_name||null,landlord_phone:landlord_phone||null,address:address||null,unit_type:'APARTMENT',status:'ACTIVE',created_by:me.id};try{if(id)await api('housing_units?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await api('housing_units',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});document.getElementById('hh132UnitModal').classList.remove('open');toast('تم حفظ الشقة ✅');await refreshAll();TAB='units';show()}catch(e){toast(e.message,true)}}
function openPolicy(){if(!ADM||!P)return;document.getElementById('hh132CycleDays').value=P.cycle_days;document.getElementById('hh132TargetHours').value=P.full_target_hours;document.getElementById('hh132HousingFee').value=P.full_housing_fee;document.getElementById('hh132PolicyModal').classList.add('open')}
async function savePolicy(){if(!ADM||!P)return;const cycle_days=Number(document.getElementById('hh132CycleDays').value),full_target_hours=Number(document.getElementById('hh132TargetHours').value),full_housing_fee=Number(document.getElementById('hh132HousingFee').value);if(!cycle_days||full_target_hours<0||full_housing_fee<0)return toast('راجع القيم',true);try{await api('housing_policies?zone_id=eq.'+Z.id+'&active=eq.true',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({cycle_days,full_target_hours,full_housing_fee,updated_at:new Date().toISOString()})});document.getElementById('hh132PolicyModal').classList.remove('open');toast('تم حفظ الإعدادات ✅');await refreshAll();TAB='settings';show()}catch(e){toast(e.message,true)}}
window.go=function(x){if(x==='housing')return show();return prevGo(x)};
window.refreshAll=async function(){await prevRefresh();ensure();try{await load()}catch(e){console.warn('hh132 load',e)}ensure();nav();if(A&&document.getElementById('sec-hh132')?.classList.contains('active'))render()};
const hh132Init=async()=>{ensure();try{await load()}catch(e){console.warn('hh132 init',e)}ensure();nav()};
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',()=>setTimeout(hh132Init,0));else setTimeout(hh132Init,0);
})();
</script>
