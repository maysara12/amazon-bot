<style id="hh131Style">
.hh131-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.hh131-tabs button{border:1px solid #263c58;background:#0d1d30;color:#cbd6e2;border-radius:11px;padding:9px 13px;font-weight:700}.hh131-tabs button.active{background:#d8b25c;color:#07111f}.hh131-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.hh131-kpi,.hh131-card{background:#0d1d30;border:1px solid #223750;border-radius:15px;padding:14px}.hh131-kpi small{display:block;color:#879bb3}.hh131-kpi b{display:block;font-size:23px;margin-top:6px}.hh131-card{margin-bottom:10px}.hh131-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0}.hh131-badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#1a2e48;font-size:11px}.hh131-badge.ok{background:#15392b;color:#83e2b2}.hh131-badge.bad{background:#421d26;color:#ffa2ac}.hh131-badge.pending{background:#4b3817;color:#f1d27b}.hh131-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.hh131-btn{border:1px solid #2b425f;background:#102238;color:#dce5ef;border-radius:9px;padding:7px 10px;font-weight:700}.hh131-btn.gold{border-color:#846d36;color:#f0cb70}.hh131-btn.bad{border-color:#6f3039;color:#ffb3bb}.hh131-note{padding:12px 14px;background:#102138;border:1px solid #243b59;border-radius:12px;color:#aabbd0;line-height:1.8;margin-bottom:14px}.hh131-policy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.hh131-policy>div{background:#102238;border:1px solid #223750;border-radius:15px;padding:14px}.hh131-policy small{display:block;color:#879bb3}.hh131-policy b{display:block;font-size:21px;margin-top:5px}.hh131-table{width:100%;min-width:850px;border-collapse:collapse}.hh131-table th,.hh131-table td{padding:10px;border-bottom:1px solid #1a2c42;text-align:right;font-size:12px}.hh131-table th{background:#102139}.hh131-wrap{overflow:auto;border:1px solid #1d314a;border-radius:14px}@media(max-width:720px){.hh131-kpis{grid-template-columns:1fr 1fr}.hh131-policy{grid-template-columns:1fr}.hh131-tabs{overflow:auto;flex-wrap:nowrap}.hh131-tabs button{white-space:nowrap}}
</style>
<script id="hh131Script">
(function(){
let Z=null,A=false,ADM=false,U=[],R=[],S=[],P=null,AS=[],TAB='overview';
const prevRefresh=window.refreshAll,prevGo=window.go;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const admin=()=>!!me&&(['OWNER','ADMIN','REVIEWER'].includes(me.role)||me.can_see_internal===true);
const unit=id=>U.find(x=>x.id===id);
function sec(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id))}
function head(a,b){const t=document.getElementById('pageTitle'),p=document.getElementById('pageSub');if(t)t.textContent=a;if(p)p.textContent=b}
async function access(){Z=(zones||[]).find(x=>x.code==='HURGHADA'||x.name_ar==='الغردقة');ADM=admin();if(!me||!Z){A=false;return}if(ADM){A=true;return}try{const r=await api(`user_zones?select=zone_id&user_id=eq.${me.id}&zone_id=eq.${Z.id}`);A=Array.isArray(r)&&r.length>0}catch(e){A=false}}
async function load(){await access();if(!A){U=[];R=[];S=[];AS=[];P=null;return}const q=[api(`housing_units?select=*&zone_id=eq.${Z.id}&order=name.asc`),api(`housing_requests?select=*&zone_id=eq.${Z.id}&order=created_at.desc`),api(`housing_stays?select=*&zone_id=eq.${Z.id}&order=check_in_date.desc`),api(`housing_policies?select=*&zone_id=eq.${Z.id}&active=eq.true&limit=1`)];if(ADM)q.push(api(`housing_assessments?select=*&zone_id=eq.${Z.id}&order=period_end.desc`));const r=await Promise.all(q);U=r[0]||[];R=r[1]||[];S=r[2]||[];P=(r[3]||[])[0]||null;AS=ADM?(r[4]||[]):[]}
function killOld(){['housingResidentModal','housingPaymentModal','housingUnitModal','sec-housing','h130RequestModal','h130UnitModal','h130HoursModal','sec-housing130'].forEach(id=>document.getElementById(id)?.remove())}
function ensure(){killOld();const m=document.querySelector('.main');if(m&&!document.getElementById('sec-hh131'))m.insertAdjacentHTML('beforeend','<section id="sec-hh131" class="section"><div id="hh131Body"></div></section>');if(!document.getElementById('hh131Modal')){document.body.insertAdjacentHTML('beforeend',`<div id="hh131Modal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="hh131Title">طلب دخول سكن</h3><button class="close" id="hh131Close">×</button></div><input id="hh131Type" type="hidden"><div class="grid2"><div class="field"><label>Rider ID</label><input id="hh131Rider" class="input"></div><div class="field"><label>اسم الطيار</label><input id="hh131Name" class="input"></div><div class="field"><label>التاريخ الفعلي</label><input id="hh131Date" class="input" type="date"></div><div class="field" id="hh131UnitField"><label>الشقة</label><select id="hh131Unit" class="input"></select></div></div><div class="field"><label>ملاحظات</label><textarea id="hh131Note" class="input" rows="3"></textarea></div><button id="hh131Save" class="btn btn-primary wide">إرسال الطلب</button></div></div>`);document.getElementById('hh131Close').onclick=()=>document.getElementById('hh131Modal').classList.remove('open');document.getElementById('hh131Save').onclick=save}}
function nav(){const d=document.getElementById('desktopNav');if(d){let b=d.querySelector('[data-go="housing"]');if(!A)b?.remove();else{if(!b){b=document.createElement('button');b.dataset.go='housing';d.appendChild(b)}b.innerHTML='<span>⌂</span>سكن الغردقة';b.onclick=show}}const m=document.getElementById('mobileNav');if(m){let b=m.querySelector('[data-go="housing"]');if(!A)b?.remove();else{if(!b){b=document.createElement('button');b.dataset.go='housing';m.appendChild(b)}b.innerHTML='<span>⌂</span>السكن';b.onclick=show}}}
function tabs(){const x=[['overview','نظرة عامة'],['requests','طلبات الدخول والخروج'],['stays','الإقامات']];if(ADM)x.push(['assess','الحساب والخصومات']);return `<div class="hh131-tabs">${x.map(a=>`<button class="${TAB===a[0]?'active':''}" data-hht="${a[0]}">${a[1]}</button>`).join('')}</div>`}
function badge(s){return `<span class="hh131-badge ${s==='APPROVED'?'ok':s==='REJECTED'?'bad':s==='PENDING'?'pending':''}">${({PENDING:'قيد المراجعة',APPROVED:'تم الاعتماد',REJECTED:'مرفوض',CANCELLED:'ملغي'}[s]||s)}</span>`}
function overview(){const act=S.filter(x=>x.status==='ACTIVE'),cap=U.reduce((a,x)=>a+Number(x.capacity||0),0),pend=R.filter(x=>x.status==='PENDING').length;return `${P?`<div class="hh131-policy"><div><small>الدورة</small><b>${P.cycle_days} يوم</b></div><div><small>التارجت</small><b>${P.full_target_hours} ساعة</b></div><div><small>قيمة السكن</small><b>${Number(P.full_housing_fee).toFixed(2)} ج</b></div></div>`:''}<div class="hh131-kpis"><div class="hh131-kpi"><small>الشقق</small><b>${U.length}</b></div><div class="hh131-kpi"><small>ساكن حاليًا</small><b>${act.length}</b></div><div class="hh131-kpi"><small>أماكن متاحة</small><b>${Math.max(0,cap-act.length)}</b></div><div class="hh131-kpi"><small>طلبات معلقة</small><b>${pend}</b></div></div><div class="hh131-note"><b>طريقة العمل:</b> المشرف يرفع طلب دخول أو خروج فقط. الإدارة تعتمد الطلب، وبعدها يبدأ أو ينتهي سجل الإقامة. لا يوجد «نظام سكن» ولا مساهمة شهرية؛ الحساب يتم من الفترة الفعلية والتارجت.</div>`}
function requests(){return `<div class="panel"><div class="panel-head"><h3>طلبات السكن</h3><button class="btn btn-secondary" data-in>+ طلب دخول</button></div>${R.length?R.map(r=>`<div class="hh131-card"><div class="hh131-row"><b>${r.request_type==='CHECK_IN'?'طلب دخول':'طلب خروج'} — ${esc(r.rider_name)}</b>${badge(r.status)}</div><div class="hh131-row"><span>Rider ID: ${esc(r.rider_id)}</span><span>التاريخ: ${esc(r.effective_date)}</span></div>${r.request_type==='CHECK_IN'?`<div>الشقة: ${esc(unit(r.unit_id)?.name||'—')}</div>`:''}${ADM&&r.status==='PENDING'?`<div class="hh131-actions"><button class="hh131-btn gold" data-ok="${r.id}">اعتماد</button><button class="hh131-btn bad" data-no="${r.id}">رفض</button></div>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات</div>'}</div>`}
function stays(){return `<div class="panel"><div class="panel-head"><h3>الإقامات</h3></div>${S.length?`<div class="hh131-wrap"><table class="hh131-table"><thead><tr><th>الطيار</th><th>Rider ID</th><th>الشقة</th><th>الدخول</th><th>الخروج</th><th>الحالة</th><th></th></tr></thead><tbody>${S.map(s=>`<tr><td>${esc(s.rider_name)}</td><td>${esc(s.rider_id)}</td><td>${esc(unit(s.unit_id)?.name||'—')}</td><td>${esc(s.check_in_date)}</td><td>${esc(s.check_out_date||'—')}</td><td>${s.status==='ACTIVE'?'ساكن حاليًا':'انتهت'}</td><td>${s.status==='ACTIVE'?`<button class="hh131-btn gold" data-out="${s.id}">طلب خروج</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد إقامات</div>'}</div>`}
function assess(){return `<div class="panel"><div class="panel-head"><h3>الحساب والخصومات</h3></div>${AS.length?`<div class="hh131-wrap"><table class="hh131-table"><thead><tr><th>الفترة</th><th>الأيام</th><th>التارجت</th><th>المحقق</th><th>قيمة الفترة</th><th>النتيجة</th><th></th></tr></thead><tbody>${AS.map(a=>`<tr><td>${a.period_start} → ${a.period_end}</td><td>${a.days_count}</td><td>${a.target_hours} س</td><td>${a.actual_hours==null?'—':a.actual_hours+' س'}</td><td>${Number(a.prorated_housing_fee).toFixed(2)} ج</td><td>${({AWAITING_HOURS:'بانتظار الساعات',NOT_REQUIRED:'مجاني',PENDING:'خصم مطلوب',RAISED:'تم رفع الخصم',WAIVED:'إعفاء'}[a.deduction_status]||a.deduction_status)}</td><td>${a.actual_hours==null?`<button class="hh131-btn" data-hours="${a.id}">إدخال الساعات</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد فترات حساب</div>'}</div>`}
function render(){if(!A)return;const body=document.getElementById('hh131Body');if(!body)return;body.innerHTML=tabs()+(TAB==='overview'?overview():TAB==='requests'?requests():TAB==='stays'?stays():assess());document.querySelectorAll('[data-hht]').forEach(b=>b.onclick=()=>{TAB=b.dataset.hht;render()});document.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>openReq('CHECK_IN'));document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>openReq('CHECK_OUT',b.dataset.out));document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>approve(b.dataset.ok));document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>reject(b.dataset.no));document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>hours(b.dataset.hours))}
function openReq(type,stayId=''){document.getElementById('hh131Type').value=type;document.getElementById('hh131Title').textContent=type==='CHECK_IN'?'طلب دخول سكن':'طلب خروج من السكن';document.getElementById('hh131Date').value=today();document.getElementById('hh131Note').value='';document.getElementById('hh131Unit').innerHTML=U.filter(x=>x.status==='ACTIVE').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const rider=document.getElementById('hh131Rider'),name=document.getElementById('hh131Name');rider.readOnly=false;name.readOnly=false;rider.value='';name.value='';document.getElementById('hh131UnitField').style.display=type==='CHECK_IN'?'block':'none';if(type==='CHECK_OUT'){const s=S.find(x=>x.id===stayId);if(!s)return;rider.value=s.rider_id;name.value=s.rider_name;rider.readOnly=true;name.readOnly=true}document.getElementById('hh131Modal').classList.add('open')}
async function save(){const t=document.getElementById('hh131Type').value,r=document.getElementById('hh131Rider').value.trim(),n=document.getElementById('hh131Name').value.trim(),d=document.getElementById('hh131Date').value,u=document.getElementById('hh131Unit').value||null;if(!r||!n||!d)return toast('Rider ID واسم الطيار والتاريخ مطلوبين',true);if(t==='CHECK_IN'&&!u)return toast('اختار الشقة',true);try{await api('housing_requests',{method:'POST',body:JSON.stringify({request_type:t,zone_id:Z.id,unit_id:t==='CHECK_IN'?u:null,rider_id:r,rider_name:n,effective_date:d,supervisor_note:document.getElementById('hh131Note').value.trim()||null,requested_by:me.id})});document.getElementById('hh131Modal').classList.remove('open');await load();render();toast('تم إرسال الطلب ✅')}catch(e){toast(e.message||'تعذر إرسال الطلب',true)}}
async function approve(id){if(!confirm('اعتماد الطلب؟'))return;try{await api('rpc/housing_approve_request',{method:'POST',body:JSON.stringify({p_request_id:id,p_review_note:null})});await load();render();toast('تم اعتماد الطلب ✅')}catch(e){toast(e.message||'تعذر الاعتماد',true)}}
async function reject(id){try{await api('rpc/housing_reject_request',{method:'POST',body:JSON.stringify({p_request_id:id,p_review_note:null})});await load();render();toast('تم رفض الطلب')}catch(e){toast(e.message||'تعذر الرفض',true)}}
async function hours(id){const v=prompt('الساعات الفعلية المحققة في الفترة:','');if(v===null)return;const h=Number(v);if(!Number.isFinite(h)||h<0)return toast('اكتب ساعات صحيحة',true);try{await api('rpc/housing_set_actual_hours',{method:'POST',body:JSON.stringify({p_assessment_id:id,p_actual_hours:h,p_source:'MANUAL'})});await load();render();toast('تم حساب الفترة ✅')}catch(e){toast(e.message||'تعذر حفظ الساعات',true)}}
async function show(){if(!A)return toast('سكن الغردقة غير متاح لحسابك',true);ensure();sec('sec-hh131');head('سكن الغردقة','طلبات الدخول والخروج والإقامات والحساب حسب التارجت');document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go==='housing'));render()}
window.go=function(x){if(x==='housing')return show();return prevGo?prevGo(x):undefined};
window.refreshAll=async function(){if(prevRefresh)await prevRefresh();await load();ensure();nav();if(document.getElementById('sec-hh131')?.classList.contains('active'))render()};
async function init(){try{await load();ensure();nav()}catch(e){console.warn('HH131',e)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(init,0));else setTimeout(init,0);
})();
</script>
