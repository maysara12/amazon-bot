plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_UPLOAD_KEYSTORE_PATH')

android {
    namespace 'com.zerozeroseven.operations'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zerozeroseven.operations'
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName '1.3.3'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.core:core:1.17.0'
}
